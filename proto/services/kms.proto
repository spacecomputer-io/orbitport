syntax = "proto3";

option go_package = "github.com/spacecomputer-io/orbitport/plugins/proto";

// Public KMS contract exposed by Orbitport through the gateway JSON-RPC API.
// The gateway owns JSON-RPC routing, PascalCase JSON serialization, validation,
// and timeout/error mapping on top of these message shapes.
// This file should stay consumer-facing even if the internal plugin contract
// later diverges for backend-specific or provider-specific needs.
package kms;

service KmsService {
  rpc Encrypt(EncryptRequest) returns (EncryptResponse);
  rpc Decrypt(DecryptRequest) returns (DecryptResponse);
  rpc Sign(SignRequest) returns (SignResponse);
  rpc Encapsulate(EncapsulateRequest) returns (EncapsulateResponse);
  rpc Decapsulate(DecapsulateRequest) returns (DecapsulateResponse);
  rpc CreateKey(CreateKeyRequest) returns (CreateKeyResponse);
  rpc GenerateDataKey(GenerateDataKeyRequest) returns (GenerateDataKeyResponse);
  rpc RotateKey(RotateKeyRequest) returns (RotateKeyResponse);
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

message Tag {
  string tag_key = 1;
  string tag_value = 2;
}

message KeyMetadata {
  string key_id = 1;
  string description = 2;
  string key_spec = 3;
  string key_usage = 4;
  bool enabled = 5;
  uint32 primary_version = 6;
  string creation_date = 7;
  repeated Tag tags = 8;
  string scheme = 9;
  optional string public_key = 10;
  optional string address = 11;
  string alias = 12;
}

message EncryptRequest {
  string key_id = 1;
  string plaintext = 2;
  optional string encryption_algorithm = 3;
}

message EncryptResponse {
  string ciphertext_blob = 1;
  string key_id = 2;
  string encryption_algorithm = 3;
}

message DecryptRequest {
  string ciphertext_blob = 1;
  optional string key_id = 2;
  optional string encryption_algorithm = 3;
}

message DecryptResponse {
  string plaintext = 1;
  string key_id = 2;
  string encryption_algorithm = 3;
}

message SignRequest {
  string key_id = 1;
  string message = 2;
  string signing_algorithm = 3;
  optional string message_type = 4;
}

message SignResponse {
  string key_id = 1;
  string signature = 2;
  string signing_algorithm = 3;
}

message EncapsulateRequest {
  string key_id = 1;
}

message EncapsulateResponse {
  string key_id = 1;
  string ciphertext = 2;
  string shared_key = 3;
  string key_agreement_algorithm = 4;
}

message DecapsulateRequest {
  string key_id = 1;
  string ciphertext = 2;
}

message DecapsulateResponse {
  string key_id = 1;
  string key_agreement_algorithm = 2;
  string shared_key = 3;
}

message CreateKeyRequest {
  string description = 1;
  string key_spec = 2;
  string key_usage = 3;
  repeated Tag tags = 4;
  optional string scheme = 5;
  string alias = 6;
}

message CreateKeyResponse {
  KeyMetadata key_metadata = 1;
}

message GenerateDataKeyRequest {
  string key_id = 1;
  optional string data_key_spec = 2;
  optional uint32 number_of_bytes = 3;
}

message GenerateDataKeyResponse {
  string key_id = 1;
  string plaintext = 2;
  string ciphertext_blob = 3;
}

message RotateKeyRequest {
  string key_id = 1;
}

message RotateKeyResponse {
  KeyMetadata key_metadata = 1;
}

message GetCapabilitiesRequest {}

message SigningCapability {
  string signing_algorithm = 1;
  repeated string message_types = 2;
}

message KeyAgreementCapability {
  string key_agreement_algorithm = 1;
}

message SchemeCapability {
  string scheme = 1;
  repeated string key_specs = 2;
  repeated string key_usages = 3;
  repeated string encryption_algorithms = 4;
  repeated string data_key_specs = 5;
  repeated SigningCapability signing_capabilities = 6;
  bool supports_encrypt = 7;
  bool supports_decrypt = 8;
  bool supports_generate_data_key = 9;
  bool supports_rotate_key = 10;
  repeated KeyAgreementCapability key_agreement_capabilities = 11;
  bool supports_encapsulate = 12;
  bool supports_decapsulate = 13;
}

message GetCapabilitiesResponse {
  repeated SchemeCapability schemes = 1;
}
