syntax = "proto3";

option go_package = "github.com/spacecomputer-io/orbitport/plugins/proto";

// Public Threshold contract exposed by Orbitport through the gateway JSON-RPC
// API. This initial surface is focused on DKG orchestration only.
package threshold;

service ThresholdService {
  rpc CoordinateDkg(CoordinateDkgRequest) returns (CoordinateDkgResponse);
}

message CoordinateDkgRequest {
  string alias = 1;
  string group_name = 2;
}

message CoordinateDkgResponse {
  string key_id = 1;
  string alias = 2;
  string group_name = 3;
  string status = 4;
  string public_key = 5;
}
