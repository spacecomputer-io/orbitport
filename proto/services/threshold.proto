syntax = "proto3";

option go_package = "github.com/spacecomputer-io/orbitport/plugins/proto";

// Public Threshold contract exposed by Orbitport through the gateway JSON-RPC
// API.
package threshold;

service ThresholdService {
  rpc CoordinateDkg(DkgRequest) returns (DkgResponse);
  rpc CoordinateSign(ThresholdSignRequest) returns (ThresholdSignResponse);
}

message DkgRequest {
  string alias = 1;
  string group_name = 2;
  string session_id = 3;
}

message DkgResponse {
  string key_id = 1;
  string alias = 2;
  string group_name = 3;
  string status = 4;
  string public_key = 5;
}

message ThresholdSignRequest {
  string key_id = 1;
  string group_name = 2;
  string session_id = 3;
  string message = 4;
}

message ThresholdSignResponse {
  string key_id = 1;
  string group_name = 2;
  string session_id = 3;
  string status = 4;
  string signature = 5;
}
