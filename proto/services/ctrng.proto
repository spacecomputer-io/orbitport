syntax = "proto3";

option go_package = "github.com/spacecomputer-io/orbitport/plugins/proto";

package ctrng;

/// CTrngService is a plugin that provides access to the cTRNG (cosmic True Random Number Generator) service.
service CTrngService {
    /// CTrng generates random numbers using the cTRNG service.
    rpc CTrng(CTrngRequest) returns (CTrngResponse); 
}

/// CTrngRequest is the request message for the CTrng RPC method.
message CTrngRequest {
    // version of the cTRNG, 1 is the only version currently supported
    optional uint32 version = 1;
    // number of random values to generate, the default is 1, and the maximum is 10.
    optional uint32 chunks = 2;
}

/// CTrngResponse is the response message for the CTrng RPC method.
message CTrngResponse {
    /// values is a list of random values generated by the cTRNG service. 
    /// The number of values returned is determined by the chunks field in the CTrngRequest.
    repeated string values = 1;
}

message CTrngResult {
    /// value is a random value generated by the cTRNG service.
    string value = 1;
    /// src is the entropy source of the random value.
    optional string src = 2;
}