syntax = "proto3";

option go_package = "github.com/spacecomputer-io/orbitport/plugins/proto";

// Internal KMS plugin contract used between the gateway and the KMS gRPC plugin.
// It intentionally mirrors proto/services/kms.proto today to keep the gateway
// adapter thin, but it is allowed to diverge if internal-only fields, provider-
// specific execution details, or future threshold-crypto flows require it.
package kmsapi;

service KmsPlugin {
  rpc Encrypt(EncryptRequest) returns (EncryptResponse);
  rpc Decrypt(DecryptRequest) returns (DecryptResponse);
  rpc Sign(SignRequest) returns (SignResponse);
  rpc Encapsulate(EncapsulateRequest) returns (EncapsulateResponse);
  rpc Decapsulate(DecapsulateRequest) returns (DecapsulateResponse);
  rpc CreateKey(CreateKeyRequest) returns (CreateKeyResponse);
  rpc GenerateDataKey(GenerateDataKeyRequest) returns (GenerateDataKeyResponse);
  rpc RotateKey(RotateKeyRequest) returns (RotateKeyResponse);
  rpc GetImportParameters(GetImportParametersRequest) returns (GetImportParametersResponse);
  rpc ImportKeyMaterial(ImportKeyMaterialRequest) returns (ImportKeyMaterialResponse);
  rpc ImportKeyMaterialVersion(ImportKeyMaterialVersionRequest) returns (ImportKeyMaterialVersionResponse);
  rpc RegisterExportWrappingKey(RegisterExportWrappingKeyRequest) returns (RegisterExportWrappingKeyResponse);
  rpc ExportKeyMaterial(ExportKeyMaterialRequest) returns (ExportKeyMaterialResponse);
  rpc DeleteKey(DeleteKeyRequest) returns (DeleteKeyResponse);
}

message Tag {
  string tag_key = 1;
  string tag_value = 2;
}

message KeyMetadata {
  string key_id = 1;
  string description = 2;
  string key_spec = 3;
  string key_usage = 4;
  bool enabled = 5;
  uint32 primary_version = 6;
  string creation_date = 7;
  repeated Tag tags = 8;
  string scheme = 9;
  optional string public_key = 10;
  optional string address = 11;
  string alias = 12;
  string origin = 13;
  bool public_only = 14;
  optional string deleted_at = 15;
  bool exportable = 16;
}

message EncryptRequest {
  string key_id = 1;
  string plaintext = 2;
  optional string encryption_algorithm = 3;
  string client_id = 4;
  AuthzContext authz_context = 5;
}

message EncryptResponse {
  string ciphertext_blob = 1;
  string key_id = 2;
  string encryption_algorithm = 3;
}

message DecryptRequest {
  string ciphertext_blob = 1;
  optional string key_id = 2;
  optional string encryption_algorithm = 3;
  string client_id = 4;
  AuthzContext authz_context = 5;
}

message DecryptResponse {
  string plaintext = 1;
  string key_id = 2;
  string encryption_algorithm = 3;
}

message SignRequest {
  string key_id = 1;
  string message = 2;
  string signing_algorithm = 3;
  optional string message_type = 4;
  string client_id = 5;
  AuthzContext authz_context = 6;
}

message SignResponse {
  string key_id = 1;
  string signature = 2;
  string signing_algorithm = 3;
}

message EncapsulateRequest {
  string key_id = 1;
  string client_id = 2;
  AuthzContext authz_context = 3;
}

message EncapsulateResponse {
  string key_id = 1;
  string ciphertext = 2;
  string shared_key = 3;
  string key_agreement_algorithm = 4;
}

message DecapsulateRequest {
  string key_id = 1;
  string ciphertext = 2;
  string client_id = 3;
  AuthzContext authz_context = 4;
}

message DecapsulateResponse {
  string key_id = 1;
  string key_agreement_algorithm = 2;
  string shared_key = 3;
}

message CreateKeyRequest {
  string description = 1;
  string key_spec = 2;
  string key_usage = 3;
  repeated Tag tags = 4;
  optional string scheme = 5;
  string client_id = 6;
  string alias = 7;
  AuthzContext authz_context = 8;
}

message CreateKeyResponse {
  KeyMetadata key_metadata = 1;
}

message GenerateDataKeyRequest {
  string key_id = 1;
  optional string data_key_spec = 2;
  optional uint32 number_of_bytes = 3;
  string client_id = 4;
  AuthzContext authz_context = 5;
}

message GenerateDataKeyResponse {
  string key_id = 1;
  string plaintext = 2;
  string ciphertext_blob = 3;
}

message RotateKeyRequest {
  string key_id = 1;
  string client_id = 2;
  AuthzContext authz_context = 3;
}

message RotateKeyResponse {
  KeyMetadata key_metadata = 1;
}

message GetImportParametersRequest {
  optional string scheme = 1;
  string key_spec = 2;
  string key_usage = 3;
  optional string hash_function = 4;
  string client_id = 5;
  AuthzContext authz_context = 6;
}

message GetImportParametersResponse {
  string wrapping_key = 1;
  string wrapping_algorithm = 2;
  string hash_function = 3;
  string key_material_format = 4;
}

message ImportKeyMaterialRequest {
  string alias = 1;
  string key_spec = 2;
  string key_usage = 3;
  string ciphertext = 4;
  optional string hash_function = 5;
  string description = 6;
  repeated Tag tags = 7;
  optional string scheme = 8;
  string client_id = 9;
  AuthzContext authz_context = 10;
  optional bool exportable = 11;
}

message ImportKeyMaterialResponse {
  KeyMetadata key_metadata = 1;
}

message ImportKeyMaterialVersionRequest {
  string key_id = 1;
  string ciphertext = 2;
  optional string hash_function = 3;
  optional uint32 version = 4;
  string client_id = 5;
  AuthzContext authz_context = 6;
}

message ImportKeyMaterialVersionResponse {
  KeyMetadata key_metadata = 1;
}

message RegisterExportWrappingKeyRequest {
  string alias = 1;
  string public_key = 2;
  string description = 3;
  repeated Tag tags = 4;
  string client_id = 5;
  AuthzContext authz_context = 6;
}

message RegisterExportWrappingKeyResponse {
  KeyMetadata key_metadata = 1;
}

message ExportKeyMaterialRequest {
  string key_id = 1;
  string destination_key_id = 2;
  optional uint32 version = 3;
  optional string hash_function = 4;
  string client_id = 5;
  AuthzContext authz_context = 6;
}

message ExportKeyMaterialResponse {
  string key_id = 1;
  string destination_key_id = 2;
  string hash_function = 3;
  map<string, string> wrapped_key_material_by_version = 4;
}

message DeleteKeyRequest {
  string key_id = 1;
  string client_id = 2;
  AuthzContext authz_context = 3;
}

message DeleteKeyResponse {
  string key_id = 1;
  reserved 2;
  reserved "deleted";
}

message AuthzContext {
  bool is_pat = 1;
  string credential_id = 2;
  repeated string scopes = 3;
}
