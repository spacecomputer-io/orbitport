syntax = "proto3";

option go_package = "github.com/spacecomputer-io/orbitport/plugins/proto";

// Internal Threshold plugin contract used between the gateway and the
// Orbitport threshold gRPC plugin.
package thresholdapi;

service ThresholdPlugin {
  rpc CoordinateDkg(DkgRequest) returns (DkgResponse);
  rpc CoordinateSign(ThresholdSignRequest) returns (ThresholdSignResponse);
}

message GroupMember {
  string node_id = 1;
  int32 party_index = 2;
  string openbao_url = 3;
  string mount = 4;
}

message DkgNodeStatus {
  string node_id = 1;
  string status = 2;
  int32 round = 3;
  repeated string pending_from = 5;
}

message DkgRequest {
  string key_name = 1;
  string group_name = 2;
  string session_id = 3;
  int32 threshold = 4;
  repeated GroupMember participants = 5;
  string client_id = 6;
}

message DkgResponse {
  string key_name = 1;
  string group_name = 2;
  string session_id = 3;
  repeated DkgNodeStatus nodes = 4;
  string public_key = 5;
}

message SignNodeStatus {
  string node_id = 1;
  string status = 2;
  int32 round = 3;
  repeated string pending_from = 4;
}

message ThresholdSignRequest {
  string key_name = 1;
  string group_name = 2;
  string session_id = 3;
  string message = 4;
  int32 threshold = 5;
  repeated GroupMember participants = 6;
  string client_id = 7;
}

message ThresholdSignResponse {
  string key_name = 1;
  string group_name = 2;
  string session_id = 3;
  repeated SignNodeStatus nodes = 4;
  string signature = 5;
}
