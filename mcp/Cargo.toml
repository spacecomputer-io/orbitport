[package]
name = "kms-mcp"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kms-mcp"
path = "src/mcpserver.rs"

[dependencies]
kms-mcp-core = { path = "../crates/mcp-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
tokio = { version = "1.51.1", features = ["io-util", "io-std", "macros", "rt-multi-thread", "signal", "time"] }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
clap = { version = "4.6.0", features = ["derive", "env"] }
thiserror = "2.0.18"

[dev-dependencies]
orbitport-kms-api = { path = "../crates/kms-api" }
