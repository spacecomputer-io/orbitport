x-plugin-base:
  &plugin-base
  image: op-plugin:latest
  build:
    context: ./plugins
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:9000/metrics"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 5s

services:
  openbao-eth-plugin-builder:
    container_name: openbao-eth-plugin-builder
    image: golang:1.25-alpine
    working_dir: /src
    volumes:
      - ${ORBITPORT_OPENBAO_ETH_PLUGIN_DIR:-../openbao-eth-plugin}:/src:ro
      - ./docker/openbao:/orbitport/docker/openbao:ro
      - openbao-plugins:/out
      - openbao-eth-go-pkg:/go/pkg/mod
      - openbao-eth-go-build:/root/.cache/go-build
    command:
      - /bin/sh
      - -ec
      - apk add --no-cache build-base linux-headers >/dev/null && /bin/sh /orbitport/docker/openbao/build-eth-plugin.sh /src /out

  openbao-pqc-plugin-builder:
    container_name: openbao-pqc-plugin-builder
    image: golang:1.25-alpine
    working_dir: /src
    environment:
      - PQC_BACKEND=${ORBITPORT_OPENBAO_PQC_BACKEND:-openssl}
    volumes:
      - ${ORBITPORT_OPENBAO_PQC_PLUGIN_DIR:-../openbao-pqc-plugin}:/src:ro
      - ./docker/openbao:/orbitport/docker/openbao:ro
      - openbao-plugins:/out
      - openbao-pqc-cache:/cache
      - openbao-pqc-go-pkg:/go/pkg/mod
      - openbao-pqc-go-build:/root/.cache/go-build
    command:
      - /bin/sh
      - -ec
      - apk add --no-cache autoconf automake build-base curl libtool linux-headers perl >/dev/null && /bin/sh /orbitport/docker/openbao/build-pqc-plugin.sh /src /out

  openbao:
    container_name: openbao
    image: openbao/openbao:latest
    depends_on:
      openbao-eth-plugin-builder:
        condition: service_completed_successfully
      openbao-pqc-plugin-builder:
        condition: service_completed_successfully
    command:
      - server
      - -dev
      - -dev-root-token-id=root
      - -dev-listen-address=0.0.0.0:8200
      - -dev-plugin-dir=/openbao/plugins
    cap_add:
      - IPC_LOCK
    ports:
      - "18200:8200"
    volumes:
      - openbao-plugins:/openbao/plugins
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 BAO_TOKEN=root bao status >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  openbao-bootstrap:
    container_name: openbao-bootstrap
    image: openbao/openbao:latest
    depends_on:
      openbao:
        condition: service_healthy
      openbao-eth-plugin-builder:
        condition: service_completed_successfully
      openbao-pqc-plugin-builder:
        condition: service_completed_successfully
    restart: "no"
    environment:
      - OPENBAO_ADDR=http://openbao:8200
      - OPENBAO_TOKEN=root
      - OPENBAO_PLUGIN_DIR=/openbao/plugins
      - OPENBAO_ETH_PLUGIN_NAME=ethereum-secrets-plugin
      - OPENBAO_ETH_MOUNT=ethereum
      - OPENBAO_PQC_PLUGIN_NAME=openbao-pqc-plugin
      - OPENBAO_PQC_MOUNT=pqc
      - OPENBAO_TRANSIT_MOUNT=transit
      - OPENBAO_KV_MOUNT=orbitport-kv
      - OPENBAO_KEY_STORE_MOUNT=key-store
    volumes:
      - openbao-plugins:/openbao/plugins
      - ./docker/openbao:/orbitport/docker/openbao:ro
    command: ["/bin/sh", "/orbitport/docker/openbao/bootstrap.sh"]

  openbao-proxy:
    container_name: openbao-proxy
    image: nginx:1.27-alpine
    depends_on:
      - openbao
    ports:
      - "8200:8200"
    volumes:
      - ./docker/openbao/openbao-proxy.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8200/v1/sys/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 2s

  plugin-kms:
    <<: *plugin-base
    container_name: plugin-kms
    build:
      context: ./plugins
    image: op-plugin:latest
    environment:
      - GOLOG_LOG_LEVEL=debug
      - ORBITPORT_PLUGIN=kms
      - ORBITPORT_GRPC_PORT=50004
      - ORBITPORT_KMS_OPENBAO_PROXY_URL=http://openbao-proxy:8200
      - ORBITPORT_KMS_TRANSIT_MOUNT=transit
      - ORBITPORT_KMS_KV_MOUNT=orbitport-kv
      - ORBITPORT_KMS_KEY_STORE_MOUNT=key-store
      - ORBITPORT_KMS_KEY_STORE_CEDAR_POLICY_PATH=/etc/orbitport/kms/key_store_default.cedar
      - ORBITPORT_KMS_ETHEREUM_MOUNT=ethereum
      - ORBITPORT_KMS_PQC_MOUNT=pqc
    volumes:
      - ./plugins/pkg/plugin/kms/cedar/key_store_default.cedar:/etc/orbitport/kms/key_store_default.cedar:ro
    depends_on:
      openbao-bootstrap:
        condition: service_completed_successfully
      openbao-proxy:
        condition: service_healthy

  plugin-auth:
    <<: *plugin-base
    container_name: plugin-auth
    environment:
      - GOLOG_LOG_LEVEL=debug
      - ORBITPORT_PLUGIN=auth
      - ORBITPORT_GRPC_PORT=50000
      - ORBITPORT_AUTH0_DOMAIN=${ORBITPORT_AUTH0_DOMAIN}
      - ORBITPORT_AUTH0_AUDIENCE=${ORBITPORT_AUTH0_AUDIENCE}
      - ORBITPORT_AUTH_SERVICE_CLIENT_IDS=${ORBITPORT_AUTH_SERVICE_CLIENT_IDS:-}

  plugin-account:
    <<: *plugin-base
    container_name: plugin-account
    environment:
      - GOLOG_LOG_LEVEL=debug
      - ORBITPORT_PLUGIN=account
      - ORBITPORT_GRPC_PORT=50005
      - ORBITPORT_ACCOUNT_DASHBOARD_URL=${ORBITPORT_ACCOUNT_DASHBOARD_URL}
      - ORBITPORT_ACCOUNT_AUTH0_DOMAIN=${ORBITPORT_ACCOUNT_AUTH0_DOMAIN}
      - ORBITPORT_ACCOUNT_AUTH0_AUDIENCE=${ORBITPORT_ACCOUNT_AUTH0_AUDIENCE}
      - ORBITPORT_ACCOUNT_AUTH0_CLIENT_ID=${ORBITPORT_ACCOUNT_AUTH0_CLIENT_ID}
      - ORBITPORT_ACCOUNT_AUTH0_CLIENT_SECRET=${ORBITPORT_ACCOUNT_AUTH0_CLIENT_SECRET}
      - ORBITPORT_ACCOUNT_CREDITS_PER_UNIT=${ORBITPORT_ACCOUNT_CREDITS_PER_UNIT:-1}
      - ORBITPORT_ACCOUNT_HTTP_TIMEOUT_SECS=${ORBITPORT_ACCOUNT_HTTP_TIMEOUT_SECS:-5}

  gateway:
    container_name: gateway 
    image: op-gateway:latest
    build:
      context: .
      dockerfile: gateway/Dockerfile
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - RUST_LOG=warn,orbitport=debug
      - ORBITPORT_HTTP_PORT=8080
      - ORBITPORT_AUTH_PLUGIN=http://plugin-auth:50000
      - ORBITPORT_KMS_PLUGIN=http://plugin-kms:50004
      - ORBITPORT_ACCOUNT_PLUGIN=http://plugin-account:50005
    depends_on:
      - plugin-auth
      - plugin-kms
      - plugin-account
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  openbao-eth-go-pkg:
  openbao-eth-go-build:
  openbao-pqc-cache:
  openbao-pqc-go-pkg:
  openbao-pqc-go-build:
  openbao-plugins:
