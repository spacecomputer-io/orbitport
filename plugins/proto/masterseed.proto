syntax = "proto3";

option go_package = "github.com/spacecomputer-io/orbitport/plugins/proto";

package masterseed;

service MasterSeedPlugin {
  rpc GetSeeds(GetSeedsRequest) returns (GetSeedsResponse);
}

message GetSeedsRequest {
  uint32 count = 1; // how many derived seeds caller wants
  string external_ctrng_seed = 2; // optional - external seed for derivation

}

message GetSeedsResponse {
  repeated string values = 1;
}
