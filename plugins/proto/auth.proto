syntax = "proto3";

option go_package = "github.com/spacecomputerio/orbitport/plugins/proto";

package auth;

service AuthPlugin {
    rpc ValidateToken(TokenValidationRequest) returns (TokenValidationResponse); 
}

message TokenValidationRequest {
    string token = 1;
}

message TokenValidationResponse {
    bool ok = 1;
}
