# In-cluster KMS benchmark for the DEV cluster. KMS is ClusterIP-only, so the
# bench has to run inside the cluster to hit the real network path.
#   kubectl apply -f bench/kms/k8s/job.yaml
#   kubectl -n orbitport logs -f job/kmsbench   # markdown table is the tail
apiVersion: batch/v1
kind: Job
metadata:
  name: kmsbench
  namespace: orbitport
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: kmsbench }
    spec:
      restartPolicy: Never
      nodeSelector: { workload: orbitport }
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: kmsbench
          image: ghcr.io/spacecomputer-io/orbitport/kmsbench:latest
          imagePullPolicy: Always
          env:
            - { name: KMS_ADDR, value: "orbitport-kms.orbitport.svc.cluster.local:50005" }
            - { name: TENANTS, value: "50" }
            - { name: CONCURRENCY, value: "1 2 5 10 20 50 100 200" }
          resources:
            requests: { cpu: "500m", memory: 256Mi }
            limits: { cpu: "2", memory: 512Mi }
