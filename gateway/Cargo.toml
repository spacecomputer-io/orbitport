[package]
name = "gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0.12"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "0.9.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }

bip32 = "0.5.3"
hex = "0.4.3"
futures = "0.3.31"
clap = { version = "4.5.32", features = ["derive", "env"] }
warp = { version = "0.3.7" }
error = "0.1.9"
prost = "0.13.5"
tonic = "0.13.0"
dotenv = "0.15.0"
tonic-health = "0.13.0"
sha2 = "0.10.8"
lazy_static = "1.5.0"
prometheus = "0.14.0"

threshold = { git = "https://www.github.com/spacecomputerio/threshold", tag = "v0.0.1" }

[build-dependencies]
tonic-build = "0.13.0"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }

[features]
localtest = []
