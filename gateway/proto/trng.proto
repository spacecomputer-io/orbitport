syntax = "proto3";

option go_package = "github.com/spacecomputerio/orbitport/agents/proto";

package trng;

service RandomnessAgent {
    rpc GetTrng(TrngRequest) returns (TrngResponse); 
}

message TrngRequest {
    bool ignore_sig = 1;
    uint32 chunks = 2;
}

message TrngResponse {
    string value = 1;
    string sig = 2;
}
