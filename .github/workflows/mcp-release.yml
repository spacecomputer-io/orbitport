name: Release Local MCP

on:
  push:
    tags: ["mcp-v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RUST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Rust target
        run: rustup target add "$RUST_TARGET"
        shell: bash
      - name: Build local server
        run: cargo build --locked --release -p kms-mcp --target "$RUST_TARGET"
        shell: bash
      - name: Smoke test
        shell: bash
        run: |
          exe="kms-mcp"
          if [[ "$RUNNER_OS" == "Windows" ]]; then exe="$exe.exe"; fi
          "target/$RUST_TARGET/release/$exe" --version
          cargo test --locked -p orbitport-kms-api -p kms-mcp-core -p kms-mcp --target "$RUST_TARGET"
      - name: Package executable
        shell: bash
        run: |
          exe="kms-mcp"
          if [[ "$RUNNER_OS" == "Windows" ]]; then exe="$exe.exe"; fi
          mkdir -p package
          cp "target/$RUST_TARGET/release/$exe" package/
          cp mcp/scripts/kms-mcp-from-file.sh package/
          tar -czf "kms-mcp-$RUST_TARGET.tar.gz" -C package "$exe" kms-mcp-from-file.sh
      - name: Attest archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: kms-mcp-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: kms-mcp-${{ matrix.target }}
          path: kms-mcp-*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kms-mcp-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum kms-mcp-*.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
