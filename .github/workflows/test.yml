name: Test 

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build
      run: make build

    - name: Test
      run: make test

    - name: Race
      run: make race

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.60
