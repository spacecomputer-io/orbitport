  #           docker.io/spacecomp/orbitport@${{ needs.build-gateway.outputs.digest }}

  # ── 4. Build Plugin ───────────────────────────────────────────────────────────
  build-plugin:
    name: Build and Scan Plugin
    # TEMP: was needs: sign-gateway. Points at build-gateway directly while
    # the sign job is disabled. Restore needs: sign-gateway once re-enabled.
    needs: build-gateway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      actions: read

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # TEMP: registry login not needed while push is disabled below.
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get SOURCE_DATE_EPOCH
        id: source_date
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> $GITHUB_OUTPUT

      - name: Build Plugin (local only, no push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./plugins
          file: ./plugins/DockerfileHardened
          platforms: linux/amd64
          # TEMP: push disabled until scan steps are validated on this branch.
          push: false
          load: true
          tags: ${{ env.PLUGIN_IMAGE }}:op-plugin-${{ github.sha }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source_date.outputs.epoch }}
          provenance: false
          # attests: type=sbom   # TEMP: SBOM attestation requires push; re-enable with push.

      # TEMP: exit-code set to false while validating on this branch, so we
      # can see the full report without every CVE finding killing the run.
      # Flip back to exit-code: true once the plugin image's CVE posture
      # has been reviewed and this becomes the real blocking gate.
      - name: Docker Scout CVE scan on built image (report only, non-blocking)
        uses: docker/scout-action@v1
        with:
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}
          command: cves
          image: ${{ env.PLUGIN_IMAGE }}:op-plugin-${{ github.sha }}
          exit-code: false
          only-severities: critical,high
          summary: true

