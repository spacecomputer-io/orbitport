name: Build Sign and Push Docker Hardened Images

on:
  push:
    branches:
      - feat/docker-hardened-images

env:
  GATEWAY_IMAGE: docker.io/spacecomp/orbitport
  PLUGIN_IMAGE: docker.io/spacecomp/orbitport

permissions: {}

jobs:
  # ── 1. Build Gateway ──────────────────────────────────────────────────────────
  build-gateway:
    name: Build and Push Gateway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      actions: read

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image:  ${{ env.GATEWAY_IMAGE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get SOURCE_DATE_EPOCH
        id: source_date
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> $GITHUB_OUTPUT

      - name: Build and Push Gateway
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          file: ./gateway/DockerfileHardened
          platforms: linux/amd64
          push: true
          tags: ${{ env.GATEWAY_IMAGE }}:op-gateway-${{ github.sha }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source_date.outputs.epoch }}
          # Disable buildx-native provenance so the SLSA generator is the sole
          # authoritative provenance source (avoids conflicting attestations).
          # Keep SBOM since that is separate from provenance.
          provenance: false
          attests: type=sbom

  # ── 2. SLSA L3 Provenance for Gateway ────────────────────────────────────────
  #
  # Runs in a fully isolated reusable workflow job with its own OIDC identity.
  # This is what makes it L3: the provenance signer is separate from the build
  # environment and cannot be tampered with by build-time code.
  #
  provenance-gateway:
    name: SLSA L3 Provenance — Gateway
    needs: build-gateway
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.build-gateway.outputs.image }}
      digest: ${{ needs.build-gateway.outputs.digest }}
      # Required for private repos: without this the generator halts to avoid
      # leaking the repo name to the public Rekor transparency log.
      private-repository: true
    secrets:
      # registry-username must be passed as a secret for normal usernames.
      # Passing it via 'with' as a plain string causes GH Actions to mask/drop it.
      registry-username: ${{ secrets.DOCKER_USERNAME }}
      registry-password: ${{ secrets.DOCKER_PASSWORD }}

  # ── 3. Cosign Sign Gateway ────────────────────────────────────────────────────
  sign-gateway:
    name: Cosign Sign Gateway
    needs: [build-gateway, provenance-gateway]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Sign the exact digest — this is what gets measured in RTMR[3].
      # By this point the digest already has SLSA L3 provenance attached.
      - name: Sign Gateway digest (keyless)
        run: |
          cosign sign --yes \
            ${{ needs.build-gateway.outputs.image }}@${{ needs.build-gateway.outputs.digest }}

      - name: Verify Gateway signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/spacecomputer-io/orbitport/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ needs.build-gateway.outputs.image }}@${{ needs.build-gateway.outputs.digest }}

  # ── 4. Build Plugin ───────────────────────────────────────────────────────────
  build-plugin:
    name: Build and Push Plugin
    needs: sign-gateway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      actions: read

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image:  ${{ env.PLUGIN_IMAGE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get SOURCE_DATE_EPOCH
        id: source_date
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> $GITHUB_OUTPUT

      - name: Build and Push Plugin
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./plugins
          file: ./plugins/DockerfileHardened
          platforms: linux/amd64
          push: true
          tags: ${{ env.PLUGIN_IMAGE }}:op-plugin-${{ github.sha }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source_date.outputs.epoch }}
          provenance: false
          attests: type=sbom

  # ── 5. SLSA L3 Provenance for Plugin ─────────────────────────────────────────
  provenance-plugin:
    name: SLSA L3 Provenance — Plugin
    needs: build-plugin
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.build-plugin.outputs.image }}
      digest: ${{ needs.build-plugin.outputs.digest }}
      # Required for private repos: without this the generator halts to avoid
      # leaking the repo name to the public Rekor transparency log.
      private-repository: true
    secrets:
      registry-username: ${{ secrets.DOCKER_USERNAME }}
      registry-password: ${{ secrets.DOCKER_PASSWORD }}

  # ── 6. Cosign Sign Plugin ─────────────────────────────────────────────────────
  sign-plugin:
    name: Cosign Sign Plugin
    needs: [build-plugin, provenance-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Sign Plugin digest (keyless)
        run: |
          cosign sign --yes \
            ${{ needs.build-plugin.outputs.image }}@${{ needs.build-plugin.outputs.digest }}

      - name: Verify Plugin signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/spacecomputer-io/orbitport/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ needs.build-plugin.outputs.image }}@${{ needs.build-plugin.outputs.digest }}