name: Build Sign and Push Docker Hardened Images

on:
  push:
    branches:
      - feat/docker-hardened-images

# Image names as workflow-level constants.
# These are referenced as literals in the SLSA generator's with: block
# because needs.*.outputs propagation of env-derived values is unreliable
# across reusable workflow boundaries (causes UNTRUSTED_IMAGE to be empty).
env:
  GATEWAY_IMAGE: docker.io/spacecomp/orbitport
  PLUGIN_IMAGE: docker.io/spacecomp/orbitport

permissions: {}

jobs:
  # ── 1. Build Gateway ──────────────────────────────────────────────────────────
  build-gateway:
    name: Build and Push Gateway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      actions: read

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get SOURCE_DATE_EPOCH
        id: source_date
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> $GITHUB_OUTPUT

      - name: Build and Push Gateway
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          file: ./gateway/DockerfileHardened
          platforms: linux/amd64
          push: true
          tags: ${{ env.GATEWAY_IMAGE }}:op-gateway-${{ github.sha }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source_date.outputs.epoch }}
          # Disable buildx-native provenance so the SLSA generator is the sole
          # authoritative provenance source (avoids conflicting attestations).
          # Keep SBOM since that is separate from provenance.
          provenance: false
          attests: type=sbom

  # ── 2. SLSA L3 Provenance for Gateway ────────────────────────────────────────
  provenance-gateway:
    name: SLSA L3 Provenance — Gateway
    needs: build-gateway
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      # Hardcoded literal — avoids the needs.*.outputs env propagation bug
      # that left UNTRUSTED_IMAGE empty in previous runs.
      image: docker.io/spacecomp/orbitport
      digest: ${{ needs.build-gateway.outputs.digest }}
      private-repository: true
    secrets:
      registry-username: ${{ secrets.DOCKER_USERNAME }}
      registry-password: ${{ secrets.DOCKER_PASSWORD }}

  # ── 3. Cosign Sign Gateway ────────────────────────────────────────────────────
  sign-gateway:
    name: Cosign Sign Gateway
    needs: [build-gateway, provenance-gateway]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Sign Gateway digest (keyless)
        run: |
          cosign sign --yes \
            docker.io/spacecomp/orbitport@${{ needs.build-gateway.outputs.digest }}

      - name: Verify Gateway signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/spacecomputer-io/orbitport/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            docker.io/spacecomp/orbitport@${{ needs.build-gateway.outputs.digest }}

  # ── 4. Build Plugin ───────────────────────────────────────────────────────────
  build-plugin:
    name: Build and Push Plugin
    needs: sign-gateway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      actions: read

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get SOURCE_DATE_EPOCH
        id: source_date
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> $GITHUB_OUTPUT

      - name: Build and Push Plugin
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./plugins
          file: ./plugins/DockerfileHardened
          platforms: linux/amd64
          push: true
          tags: ${{ env.PLUGIN_IMAGE }}:op-plugin-${{ github.sha }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source_date.outputs.epoch }}
          provenance: false
          attests: type=sbom

  # ── 5. SLSA L3 Provenance for Plugin ─────────────────────────────────────────
  provenance-plugin:
    name: SLSA L3 Provenance — Plugin
    needs: build-plugin
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: docker.io/spacecomp/orbitport
      digest: ${{ needs.build-plugin.outputs.digest }}
      private-repository: true
    secrets:
      registry-username: ${{ secrets.DOCKER_USERNAME }}
      registry-password: ${{ secrets.DOCKER_PASSWORD }}

  # ── 6. Cosign Sign Plugin ─────────────────────────────────────────────────────
  sign-plugin:
    name: Cosign Sign Plugin
    needs: [build-plugin, provenance-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Sign Plugin digest (keyless)
        run: |
          cosign sign --yes \
            docker.io/spacecomp/orbitport@${{ needs.build-plugin.outputs.digest }}

      - name: Verify Plugin signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/spacecomputer-io/orbitport/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            docker.io/spacecomp/orbitport@${{ needs.build-plugin.outputs.digest }}