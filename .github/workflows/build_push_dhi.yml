name: Build Sign and Push Docker Hardened Images

on:
  push:
    branches:
      # TEMP: testing branch for the new pre/post-build Scout scan steps.
      # Switch back to feat/docker-hardened-images (or main) once scans pass
      # and pushing is re-enabled below.
      - feat/dhi-v2

# Image names as workflow-level constants.
# These are referenced as literals in the SLSA generator's with: block
# because needs.*.outputs propagation of env-derived values is unreliable
# across reusable workflow boundaries (causes UNTRUSTED_IMAGE to be empty).
env:
  GATEWAY_IMAGE: docker.io/spacecomp/orbitport
  PLUGIN_IMAGE: docker.io/spacecomp/orbitport

permissions: {}

jobs:
  # ── 0. Pre-build: Scan and Verify Hardened Base Image ───────────────────────
  scan-base-image:
    name: Scan & Verify Hardened Base Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      base_image: ${{ steps.extract.outputs.base_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract FROM image from Dockerfile
        id: extract
        run: |
          DOCKERFILE=gateway/DockerfileHardened

          # Export any ARG defaults declared before the first FROM (e.g.
          # `ARG RUST_VERSION=1.82`), so we can resolve ${RUST_VERSION}-style
          # references used inside the FROM line itself. Without this, the
          # raw string "dhi.io/rust:${RUST_VERSION}-debian13-dev" gets passed
          # through unresolved, and bash later expands the unset var to
          # empty, producing a broken tag like "rust:-debian13-dev".
          while IFS= read -r line; do
            var_assignment=$(echo "$line" | sed -E 's/^ARG[[:space:]]+//')
            if [[ "$var_assignment" == *"="* ]]; then
              export "${var_assignment?}"
            fi
          done < <(awk '/^FROM/{exit} /^ARG/{print}' "$DOCKERFILE")

          RAW_FROM=$(grep -m1 '^FROM' "$DOCKERFILE" | awk '{print $2}')
          BASE_IMAGE=$(envsubst <<< "$RAW_FROM")

          echo "Resolved base image: $BASE_IMAGE"
          echo "base_image=$BASE_IMAGE" >> $GITHUB_OUTPUT

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # dhi.io is a SEPARATE registry host from docker.io — same Docker ID
      # credentials work, but each host needs its own explicit login.
      # Without the dhi.io login below, cosign verify and Scout get 401s
      # even if you're already logged into docker.io.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to DHI registry (dhi.io)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify Docker Hardened Image signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/docker/dhi-.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ steps.extract.outputs.base_image }}

      - name: Docker Scout CVE scan (fail on critical/high)
        uses: docker/scout-action@v1
        with:
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}
          command: cves
          image: ${{ steps.extract.outputs.base_image }}
          exit-code: true
          only-severities: critical,high

  # ── 1. Build Gateway ──────────────────────────────────────────────────────────
  build-gateway:
    name: Build and Scan Gateway
    needs: scan-base-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      actions: read

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # TEMP: registry login not needed while push is disabled below.
      # Re-enable once we're ready to push signed images again.
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get SOURCE_DATE_EPOCH
        id: source_date
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> $GITHUB_OUTPUT

      - name: Build Gateway (local only, no push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          file: ./gateway/DockerfileHardened
          platforms: linux/amd64
          # TEMP: push disabled until scan steps are validated on this branch.
          # Flip back to push: true (and restore tags/attests below) once green.
          push: false
          load: true
          tags: ${{ env.GATEWAY_IMAGE }}:op-gateway-${{ github.sha }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source_date.outputs.epoch }}
          # Disable buildx-native provenance so the SLSA generator is the sole
          # authoritative provenance source (avoids conflicting attestations).
          provenance: false
          # attests: type=sbom   # TEMP: SBOM attestation requires push; re-enable with push.

      - name: Docker Scout CVE scan on built image (fail on critical/high)
        uses: docker/scout-action@v1
        with:
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}
          command: cves
          image: ${{ env.GATEWAY_IMAGE }}:op-gateway-${{ github.sha }}
          exit-code: true
          only-severities: critical,high

  # ── 2. SLSA L3 Provenance for Gateway ────────────────────────────────────────
  # TEMP: disabled while push is off — the SLSA generator needs to pull the
