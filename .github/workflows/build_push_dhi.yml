name: Build Sign and Push Docker Hardened Images

on:
  workflow_dispatch:

# Image names as workflow-level constants.
# These are referenced as literals in the SLSA generator's with: block
# because needs.*.outputs propagation of env-derived values is unreliable
# across reusable workflow boundaries (causes UNTRUSTED_IMAGE to be empty).
env:
  GATEWAY_IMAGE: docker.io/spacecomp/orbitport
  PLUGIN_IMAGE: docker.io/spacecomp/orbitport

permissions: {}

jobs:
  # ── 0. Pre-build: Scan and Verify Hardened Base Image ───────────────────────
  scan-base-image:
    name: Scan & Verify Hardened Base Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      final_image: ${{ steps.extract.outputs.final_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract FROM images from Dockerfile
        id: extract
        run: |
          DOCKERFILE=gateway/hardened.Dockerfile

          # Export any ARG defaults declared anywhere in the file (e.g.
          # `ARG RUST_VERSION=1.82`), so we can resolve ${RUST_VERSION}-style
          # references used inside FROM lines. Without this, a raw string
          # like "dhi.io/rust:${RUST_VERSION}-debian13-dev" passes through
          # unresolved, and bash later expands the unset var to empty.
          while IFS= read -r line; do
            var_assignment=$(echo "$line" | sed -E 's/^ARG[[:space:]]+//')
            if [[ "$var_assignment" == *"="* ]]; then
              export "${var_assignment?}"
            fi
          done < <(grep '^ARG' "$DOCKERFILE")

          # This Dockerfile is multi-stage: an early FROM (e.g. rust:...-dev)
          # is used only to compile the binary and is discarded, while the
          # LAST FROM is the actual runtime base that ships. CVEs in the
          # build stage don't reach production, so we scan the two stages
          # separately and only gate the pipeline on the final stage.
          BUILD_RAW=$(grep -m1 '^FROM' "$DOCKERFILE" | awk '{print $2}')
          FINAL_RAW=$(grep '^FROM' "$DOCKERFILE" | tail -1 | awk '{print $2}')

          BUILD_IMAGE=$(envsubst <<< "$BUILD_RAW")
          FINAL_IMAGE=$(envsubst <<< "$FINAL_RAW")

          echo "Build-stage base (informational scan only): $BUILD_IMAGE"
          echo "Final-stage base (blocking scan):            $FINAL_IMAGE"
          echo "build_image=$BUILD_IMAGE" >> $GITHUB_OUTPUT
          echo "final_image=$FINAL_IMAGE" >> $GITHUB_OUTPUT

      # dhi.io is a SEPARATE registry host from docker.io — same Docker ID
      # credentials work, but each host needs its own explicit login.
      # Without the dhi.io login below, cosign verify and Scout get 401s
      # even if you're already logged into docker.io.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to DHI registry (dhi.io)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # DHI signatures don't live at dhi.io/<image>:<tag> the way a normal
      # cosign-signed image does — they're published under
      # registry.scout.docker.com/<org>/dhi-<image>@sha256:<digest>, which
      # Docker Scout resolves automatically. Docker's own docs recommend
      # `docker scout attest get --verify` over hand-rolled cosign commands
      # for exactly this reason — it understands DHI's attestation layout
      # and resolves the platform/digest itself.
      - name: Install Docker Scout CLI
        run: curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s --

      - name: Verify build-stage base attestation (signed by Docker)
        run: |
          docker scout attest get \
            --predicate-type https://cyclonedx.org/bom/v1.6 \
            --verify --skip-tlog \
            ${{ steps.extract.outputs.build_image }}

      - name: Verify final-stage base attestation (signed by Docker)
        run: |
          docker scout attest get \
            --predicate-type https://cyclonedx.org/bom/v1.6 \
            --verify --skip-tlog \
            ${{ steps.extract.outputs.final_image }}

      - name: Docker Scout CVE scan — build stage (informational, non-blocking)
        uses: docker/scout-action@v1
        with:
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}
          command: cves
          image: ${{ steps.extract.outputs.build_image }}
          exit-code: false
          only-severities: critical,high
          # Writes the CVE report as a GitHub Job Summary instead of failing
          # the job — this is the build-stage (dev) image, discarded after
          # compile, so it's reported for visibility only.
          summary: true

      - name: Docker Scout CVE scan — final stage (blocking, fails on critical/high)
        uses: docker/scout-action@v1
        with:
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}
          command: cves
          image: ${{ steps.extract.outputs.final_image }}
          exit-code: true
          only-severities: critical,high
          summary: true

  # ── 1. Build Gateway ──────────────────────────────────────────────────────────
  build-gateway:
    name: Build and Scan Gateway
    needs: scan-base-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      actions: read

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get SOURCE_DATE_EPOCH
        id: source_date
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> $GITHUB_OUTPUT

      - name: Build and Push Gateway
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          file: ./gateway/hardened.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.GATEWAY_IMAGE }}:op-gateway-${{ github.sha }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source_date.outputs.epoch }}
          # Disable buildx-native provenance so the SLSA generator is the sole
          # authoritative provenance source (avoids conflicting attestations).
          provenance: false
          attests: type=sbom

      # TODO: flip exit-code to true once the gateway image's CVE findings
      # have been triaged — this becomes the real blocking gate for what ships.
      - name: Docker Scout CVE scan — built image (non-blocking)
        uses: docker/scout-action@v1
        with:
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}
          command: cves
          image: ${{ env.GATEWAY_IMAGE }}:op-gateway-${{ github.sha }}
          exit-code: false
          only-severities: critical,high
          summary: true

  # ── 2. SLSA L3 Provenance for Gateway ────────────────────────────────────────
  provenance-gateway:
    name: SLSA L3 Provenance — Gateway
    needs: build-gateway
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: docker.io/spacecomp/orbitport
      digest: ${{ needs.build-gateway.outputs.digest }}
      private-repository: true
    secrets:
      registry-username: ${{ secrets.DOCKER_USERNAME }}
      registry-password: ${{ secrets.DOCKER_PASSWORD }}

  # ── 3. Cosign Sign Gateway ────────────────────────────────────────────────────
  sign-gateway:
    name: Cosign Sign Gateway
    needs: [build-gateway, provenance-gateway]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Sign Gateway digest (keyless)
        run: |
          cosign sign --yes \
            ${{ env.GATEWAY_IMAGE }}@${{ needs.build-gateway.outputs.digest }}
      - name: Verify Gateway signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/spacecomputer-io/orbitport/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ env.GATEWAY_IMAGE }}@${{ needs.build-gateway.outputs.digest }}

  # ── 4. Build Plugin ───────────────────────────────────────────────────────────
  build-plugin:
    name: Build and Scan Plugin
    needs: sign-gateway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      actions: read

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get SOURCE_DATE_EPOCH
        id: source_date
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> $GITHUB_OUTPUT

      - name: Build and Push Plugin
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./plugins
          file: ./plugins/hardened.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.PLUGIN_IMAGE }}:op-plugin-${{ github.sha }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source_date.outputs.epoch }}
          provenance: false
          attests: type=sbom

      # TODO: flip exit-code to true once the plugin image's CVE findings
      # have been triaged — this becomes the real blocking gate for what ships.
      - name: Docker Scout CVE scan — built image (non-blocking)
        uses: docker/scout-action@v1
        with:
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}
          command: cves
          image: ${{ env.PLUGIN_IMAGE }}:op-plugin-${{ github.sha }}
          exit-code: false
          only-severities: critical,high
          summary: true

  # ── 5. SLSA L3 Provenance for Plugin ─────────────────────────────────────────
  provenance-plugin:
    name: SLSA L3 Provenance — Plugin
    needs: build-plugin
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: docker.io/spacecomp/orbitport
      digest: ${{ needs.build-plugin.outputs.digest }}
      private-repository: true
    secrets:
      registry-username: ${{ secrets.DOCKER_USERNAME }}
      registry-password: ${{ secrets.DOCKER_PASSWORD }}

  # ── 6. Cosign Sign Plugin ─────────────────────────────────────────────────────
  sign-plugin:
    name: Cosign Sign Plugin
    needs: [build-plugin, provenance-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Sign Plugin digest (keyless)
        run: |
          cosign sign --yes \
            ${{ env.PLUGIN_IMAGE }}@${{ needs.build-plugin.outputs.digest }}
      - name: Verify Plugin signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/spacecomputer-io/orbitport/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ env.PLUGIN_IMAGE }}@${{ needs.build-plugin.outputs.digest }}