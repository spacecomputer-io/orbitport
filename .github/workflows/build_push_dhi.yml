name: Build Sign and Push Docker Hardened Images

on:
  push:
    branches:
      - feat/docker-hardened-images

env:
  REGISTRY: docker.io
  GATEWAY_IMAGE: docker.io/shaunaksc/gateway-artifact
  PLUGIN_IMAGE: docker.io/shaunaksc/plugin-artifact

jobs:
  build-gateway:
    name: Build and Sign Gateway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for keyless cosign signing

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Get SOURCE_DATE_EPOCH
        id: source_date
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> $GITHUB_OUTPUT

      - name: Build and Push Gateway
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.GATEWAY_IMAGE }}:${{ github.sha }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source_date.outputs.epoch }}
          attests: |
            type=provenance,mode=max
            type=sbom
          provenance: true

      - name: Sign Gateway Image (keyless)
        run: |
          cosign sign --yes \
            ${{ env.GATEWAY_IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Debug Provenance
        run: |
          docker buildx imagetools inspect \
            ${{ env.GATEWAY_IMAGE }}@${{ steps.build.outputs.digest }} \
            --format '{{json .Provenance.SLSA}}' | jq .

      - name: Attest Gateway Provenance (keyless)
        run: |
          # Extract provenance generated by buildx
          docker buildx imagetools inspect \
            ${{ env.GATEWAY_IMAGE }}@${{ steps.build.outputs.digest }} \
            --format '{{json .Provenance.SLSA}}' > /tmp/gateway-provenance.json

          cosign attest --yes \
            --predicate /tmp/gateway-provenance.json \
            --type slsaprovenance02 \
            ${{ env.GATEWAY_IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Verify Gateway Signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/spacecomputer-io/orbitport/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ env.GATEWAY_IMAGE }}@${{ steps.build.outputs.digest }}

  build-plugin:
    name: Build and Sign Plugin
    runs-on: ubuntu-latest
    needs: build-gateway # sequential - runs after gateway
    permissions:
      contents: read
      id-token: write # required for keyless cosign signing

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Get SOURCE_DATE_EPOCH
        id: source_date
        run: echo "epoch=$(git log -1 --pretty=%ct)" >> $GITHUB_OUTPUT

      - name: Build and Push Plugin
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./plugins
          file: ./plugins/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.PLUGIN_IMAGE }}:${{ github.sha }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source_date.outputs.epoch }}
          attests: |
            type=provenance,mode=max
            type=sbom
          provenance: true

      - name: Sign Plugin Image (keyless)
        run: |
          cosign sign --yes \
            ${{ env.PLUGIN_IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Attest Plugin Provenance (keyless)
        run: |
          # Extract provenance generated by buildx
          docker buildx imagetools inspect \
            ${{ env.PLUGIN_IMAGE }}@${{ steps.build.outputs.digest }} \
            --format '{{json .Provenance.SLSA}}' > /tmp/plugin-provenance.json

          cosign attest --yes \
            --predicate /tmp/plugin-provenance.json \
            --type slsaprovenance02 \
            ${{ env.PLUGIN_IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Verify Plugin Signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/spacecomputer-io/orbitport/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ env.PLUGIN_IMAGE }}@${{ steps.build.outputs.digest }}