name: Build Reproducible Docker Images as Artifacts

on:
  workflow_dispatch:
    inputs:
      dockerfile_variant:
        description: "Which Dockerfiles to use"
        required: true
        default: "hardened"
        type: choice
        options:
          - hardened
          - normal

env:
  GW_NAME: op-gateway
  PLUGIN_NAME: op-plugin
  TZ: UTC
  LC_ALL: C
  LANG: C.UTF-8

jobs:
  build-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set SOURCE_DATE_EPOCH from latest commit timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Pick Dockerfiles
        run: |
          set -euo pipefail
          if [ "${{ inputs.dockerfile_variant }}" = "hardened" ]; then
            echo "GW_DOCKERFILE=./gateway/DockerfileHardned" >> "$GITHUB_ENV"
            echo "PLUGIN_DOCKERFILE=./plugins/DockerfileHardned" >> "$GITHUB_ENV"
          else
            echo "GW_DOCKERFILE=./gateway/Dockerfile" >> "$GITHUB_ENV"
            echo "PLUGIN_DOCKERFILE=./plugins/Dockerfile" >> "$GITHUB_ENV"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to Docker Hardened Images
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_ID }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Set up Docker Buildx (pin BuildKit v0.13.2)
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.13.2

      - name: Build GW image to OCI layout + deterministic tar
        run: |
          set -euo pipefail
          mkdir -p out

          docker buildx build \
            --progress=plain \
            --platform linux/amd64 \
            -f "${GW_DOCKERFILE}" \
            --build-arg SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" \
            --output type=oci,dest="out/${GW_NAME}.oci" \
            ./gateway

          tar --sort=name \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 --group=0 --numeric-owner \
              --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
              -cf "out/${GW_NAME}.oci.tar" -C out "${GW_NAME}.oci"

          sha256sum "out/${GW_NAME}.oci.tar" | tee "out/${GW_NAME}.sha256"

      - name: Build Plugin image to OCI layout + deterministic tar
        run: |
          set -euo pipefail
          mkdir -p out

          docker buildx build \
            --progress=plain \
            --platform linux/amd64 \
            -f "${PLUGIN_DOCKERFILE}" \
            --build-arg SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH}" \
            --output type=oci,dest="out/${PLUGIN_NAME}.oci" \
            ./plugins

          tar --sort=name \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 --group=0 --numeric-owner \
              --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
              -cf "out/${PLUGIN_NAME}.oci.tar" -C out "${PLUGIN_NAME}.oci"

          sha256sum "out/${PLUGIN_NAME}.oci.tar" | tee "out/${PLUGIN_NAME}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: images-oci
          path: |
            out/*.oci.tar
            out/*.sha256
          if-no-files-found: error
