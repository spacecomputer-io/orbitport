name: Test & Build Gateway 

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "examples/**" ]
  pull_request:
    branches: [ "*" ]
    paths-ignore: [ "examples/**" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Install protoc
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Format
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - name: Build
      run: cargo build --workspace --locked --verbose
    - name: Run unit tests
      working-directory: ./gateway
      run: make test
    - name: Test shared KMS and local MCP
      run: cargo test --locked -p orbitport-kms-api -p kms-mcp-core -p kms-mcp
