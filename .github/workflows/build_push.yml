name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.repository }}

jobs:
  build-and-push:
    
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set image names
      run: |
        echo "IMAGE_GW=${REGISTRY}/${NAMESPACE}/op-gateway" >> $GITHUB_ENV
        echo "IMAGE_PLUGIN=${REGISTRY}/${NAMESPACE}/op-plugin" >> $GITHUB_ENV

    - name: Log in to the Container registry
      uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for GW
      id: meta_gw
      uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
      with:
        images: ${{ env.IMAGE_GW }}

    - name: Extract metadata (tags, labels) for plugin
      id: meta_plugin
      uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
      with:
        images: ${{ env.IMAGE_PLUGIN }}

    - name: Build and push GW image
      id: push_gw
      uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
      with:
        context: ./gateway
        push: true
        tags: ${{ steps.meta_gw.outputs.tags }}
        labels: ${{ steps.meta_gw.outputs.labels }}

## TODO enable after upgrading the plan, or making this repository public
    # - name: Generate GW artifact attestation
    #   uses: actions/attest-build-provenance@v2
    #   with:
    #     subject-name: ${{ env.IMAGE_GW }}
    #     subject-digest: ${{ steps.push_gw.outputs.digest }}
    #     push-to-registry: true

    - name: Build and push Plugin image
      id: push
      uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
      with:
        context: ./plugins
        push: true
        tags: ${{ steps.meta_plugin.outputs.tags }}
        labels: ${{ steps.meta_plugin.outputs.labels }}

