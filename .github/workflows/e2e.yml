name: E2e Tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Docker using Docker's official script
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
        continue-on-error: false
      - name: Install Docker Compose
        run: |
            sudo curl -L "https://github.com/docker/compose/releases/download/v2.34.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            docker-compose --version
        continue-on-error: false
      
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start devenv
        run: |
          make devenv-up
        continue-on-error: false

      - name: Run e2e test (happy path)
        run: |
          make E2E_PROFILE=happy e2e-lazy

      - name: Run e2e test (offline)
        run: |
          make E2E_PROFILE=offline e2e-lazy

      - name: Run e2e test (load)
        run: |
          make E2E_PROFILE=load e2e-lazy

      - name: Stop devenv
        run: |
          make devenv-down
