name: Build & Push Hardened Images (branch test)

on:
  push:
    branches:
      - feat/docker-hardened-images

env:
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.repository }}

jobs:
  build-and-push-hardened:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for git log timestamp

      - name: Set SOURCE_DATE_EPOCH from commit timestamp
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set image names
        run: |
          echo "IMAGE_GW=${REGISTRY}/${NAMESPACE}/op-gateway-hardened" >> $GITHUB_ENV
          echo "IMAGE_PLUGIN=${REGISTRY}/${NAMESPACE}/op-plugin-hardened" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required ONLY because DockerfileHardened uses `FROM dhi.io/...`
      - name: Log in to Docker Hardened Images (DHI)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_ID }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push Gateway hardened image
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          file: ./gateway/DockerfileHardened
          push: true
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          tags: |
            ${{ env.IMAGE_GW }}:sha-${{ env.SHORT_SHA }}
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}

      - name: Build and push Plugin hardened image
        uses: docker/build-push-action@v6
        with:
          context: ./plugins
          file: ./plugins/DockerfileHardened
          push: true
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          tags: |
            ${{ env.IMAGE_PLUGIN }}:sha-${{ env.SHORT_SHA }}
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
