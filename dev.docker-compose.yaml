x-plugin-base:
  &plugin-base
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:9000/metrics"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 5s

x-mocker-base:
  &mocker-base
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  openbao-eth-plugin-builder:
    container_name: openbao-eth-plugin-builder
    image: golang:1.25-alpine
    working_dir: /src
    volumes:
      - ${ORBITPORT_OPENBAO_ETH_PLUGIN_DIR:-../openbao-eth-plugin}:/src:ro
      - ./docker/openbao:/orbitport/docker/openbao:ro
      - openbao-plugins:/out
      - openbao-eth-go-pkg:/go/pkg/mod
      - openbao-eth-go-build:/root/.cache/go-build
    command:
      - /bin/sh
      - -ec
      - apk add --no-cache build-base linux-headers >/dev/null && /bin/sh /orbitport/docker/openbao/build-eth-plugin.sh /src /out

  openbao-pqc-plugin-builder:
    container_name: openbao-pqc-plugin-builder
    image: golang:1.25-alpine
    working_dir: /src
    environment:
      - PQC_BACKEND=${ORBITPORT_OPENBAO_PQC_BACKEND:-openssl}
    volumes:
      - ${ORBITPORT_OPENBAO_PQC_PLUGIN_DIR:-../openbao-pqc-plugin}:/src:ro
      - ./docker/openbao:/orbitport/docker/openbao:ro
      - openbao-plugins:/out
      - openbao-pqc-cache:/cache
      - openbao-pqc-go-pkg:/go/pkg/mod
      - openbao-pqc-go-build:/root/.cache/go-build
    command:
      - /bin/sh
      - -ec
      - apk add --no-cache autoconf automake build-base curl libtool linux-headers perl >/dev/null && /bin/sh /orbitport/docker/openbao/build-pqc-plugin.sh /src /out

  openbao-threshold-plugin-builder:
    container_name: openbao-threshold-plugin-builder
    image: golang:1.26-alpine
    working_dir: /src
    volumes:
      - ${ORBITPORT_OPENBAO_THRESHOLD_PLUGIN_DIR:-../openbao-threshold-plugin}:/src:ro
      - ./docker/openbao:/orbitport/docker/openbao:ro
      - openbao-plugins:/out
      - openbao-threshold-go-pkg:/go/pkg/mod
      - openbao-threshold-go-build:/root/.cache/go-build
    command:
      - /bin/sh
      - -ec
      - apk add --no-cache build-base linux-headers git cmake ninja ca-certificates >/dev/null && /bin/sh /orbitport/docker/openbao/build-threshold-plugin.sh /src /out

  openbao:
    container_name: openbao
    image: openbao/openbao:latest
    depends_on:
      openbao-eth-plugin-builder:
        condition: service_completed_successfully
      openbao-pqc-plugin-builder:
        condition: service_completed_successfully
      openbao-threshold-plugin-builder:
        condition: service_completed_successfully
    command:
      - server
      - -dev
      - -dev-root-token-id=root
      - -dev-listen-address=0.0.0.0:8200
      - -dev-plugin-dir=/openbao/plugins
    cap_add:
      - IPC_LOCK
    ports:
      - "18200:8200"
    volumes:
      - openbao-plugins:/openbao/plugins
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 BAO_TOKEN=root bao status >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  openbao-1:
    container_name: openbao-1
    image: openbao/openbao:latest
    depends_on:
      openbao-eth-plugin-builder:
        condition: service_completed_successfully
      openbao-pqc-plugin-builder:
        condition: service_completed_successfully
      openbao-threshold-plugin-builder:
        condition: service_completed_successfully
    command:
      - server
      - -dev
      - -dev-root-token-id=root
      - -dev-listen-address=0.0.0.0:8200
      - -dev-plugin-dir=/openbao/plugins
    cap_add:
      - IPC_LOCK
    ports:
      - "18201:8200"
    volumes:
      - openbao-plugins:/openbao/plugins
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 BAO_TOKEN=root bao status >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  openbao-2:
    container_name: openbao-2
    image: openbao/openbao:latest
    depends_on:
      openbao-eth-plugin-builder:
        condition: service_completed_successfully
      openbao-pqc-plugin-builder:
        condition: service_completed_successfully
      openbao-threshold-plugin-builder:
        condition: service_completed_successfully
    command:
      - server
      - -dev
      - -dev-root-token-id=root
      - -dev-listen-address=0.0.0.0:8200
      - -dev-plugin-dir=/openbao/plugins
    cap_add:
      - IPC_LOCK
    ports:
      - "18202:8200"
    volumes:
      - openbao-plugins:/openbao/plugins
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 BAO_TOKEN=root bao status >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  openbao-bootstrap:
    container_name: openbao-bootstrap
    image: openbao/openbao:latest
    depends_on:
      openbao:
        condition: service_healthy
      openbao-eth-plugin-builder:
        condition: service_completed_successfully
      openbao-pqc-plugin-builder:
        condition: service_completed_successfully
      openbao-threshold-plugin-builder:
        condition: service_completed_successfully
    restart: "no"
    environment:
      - OPENBAO_ADDR=http://openbao:8200
    volumes:
      - openbao-plugins:/openbao/plugins
      - ./docker/openbao:/orbitport/docker/openbao:ro
    command: ["/bin/sh", "/orbitport/docker/openbao/bootstrap.sh"]

  openbao-bootstrap-1:
    container_name: openbao-bootstrap-1
    image: openbao/openbao:latest
    depends_on:
      openbao-1:
        condition: service_healthy
      openbao-eth-plugin-builder:
        condition: service_completed_successfully
      openbao-pqc-plugin-builder:
        condition: service_completed_successfully
      openbao-threshold-plugin-builder:
        condition: service_completed_successfully
    restart: "no"
    environment:
      - OPENBAO_ADDR=http://openbao-1:8200
    volumes:
      - openbao-plugins:/openbao/plugins
      - ./docker/openbao:/orbitport/docker/openbao:ro
    command: ["/bin/sh", "/orbitport/docker/openbao/bootstrap.sh"]

  openbao-bootstrap-2:
    container_name: openbao-bootstrap-2
    image: openbao/openbao:latest
    depends_on:
      openbao-2:
        condition: service_healthy
      openbao-eth-plugin-builder:
        condition: service_completed_successfully
      openbao-pqc-plugin-builder:
        condition: service_completed_successfully
      openbao-threshold-plugin-builder:
        condition: service_completed_successfully
    restart: "no"
    environment:
      - OPENBAO_ADDR=http://openbao-2:8200
    volumes:
      - openbao-plugins:/openbao/plugins
      - ./docker/openbao:/orbitport/docker/openbao:ro
    command: ["/bin/sh", "/orbitport/docker/openbao/bootstrap.sh"]

  openbao-proxy:
    container_name: openbao-proxy
    image: nginx:1.27-alpine
    depends_on:
      - openbao
    ports:
      - "8200:8200"
    volumes:
      - ./docker/openbao/openbao-proxy.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8200/v1/sys/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 2s

  openbao-proxy-1:
    container_name: openbao-proxy-1
    image: nginx:1.27-alpine
    depends_on:
      - openbao-1
    ports:
      - "8201:8200"
    volumes:
      - ./docker/openbao/openbao-proxy-1.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8200/v1/sys/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 2s

  openbao-proxy-2:
    container_name: openbao-proxy-2
    image: nginx:1.27-alpine
    depends_on:
      - openbao-2
    ports:
      - "8202:8200"
    volumes:
      - ./docker/openbao/openbao-proxy-2.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8200/v1/sys/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 2s

  plugin-ipfs:
    <<: *plugin-base
    container_name: plugin-ipfs
    build:
      context: ./plugins
    image: op-plugin:latest
    environment:
      - GOLOG_LOG_LEVEL=debug
      - ORBITPORT_PLUGIN=ipfs
      - ORBITPORT_GRPC_PORT=50002
      - ORBITPORT_IPFS_ADDRESS=http://ipfs-node:5001
    ports:
      - 50002:50002 # expose the port for integration tests

  aptos-orbital-api:
    <<: *mocker-base
    container_name: aptos-orbital-api
    build:
      context: ./plugins
      args:
        - BUILD_TARGET=mocker
    image: op-mocker:latest
    environment:
      - OPMOCK_SERVICE=aptosorbital_api
      - OPMOCK_PORT=8001
      - OPMOCK_PROFILE=${OPMOCK_PROFILE}
    depends_on:
      - aptos-orbital-auth

  aptos-orbital-auth:
    <<: *mocker-base
    container_name: aptos-orbital-auth
    build:
      context: ./plugins
      args:
        - BUILD_TARGET=mocker
    image: op-mocker:latest
    environment:
      - OPMOCK_SERVICE=aptosorbital_auth
      - OPMOCK_PORT=8002
    ports:
      - "8002:8002"

  plugin-aptos-orbital:
    <<: *plugin-base
    container_name: plugin-aptos-orbital
    build:
      context: ./plugins
    image: op-plugin:latest
    environment:
      - GOLOG_LOG_LEVEL=debug
      - ORBITPORT_PLUGIN=aptosorbital
      - ORBITPORT_GRPC_PORT=50001
      # Mock credentials for the local dev mocker only. These are not real secrets.
      - ORBITPORT_APTOS_ORBITAL_CLIENT_ID=dev-client-id
      - ORBITPORT_APTOS_ORBITAL_CLIENT_SECRET=dev-client-secret
      - ORBITPORT_APTOS_ORBITAL_API_URL=http://aptos-orbital-api:8001
      - ORBITPORT_APTOS_ORBITAL_AUTH_URL=http://aptos-orbital-auth:8002
    depends_on:
      - plugin-auth
      - aptos-orbital-api
      - aptos-orbital-auth

  plugin-masterseed:
    <<: *plugin-base
    container_name: plugin-masterseed
    build:
      context: ./plugins
    image: op-plugin:latest
    environment:
      - GOLOG_LOG_LEVEL=debug
      - ORBITPORT_PLUGIN=masterseed
      - ORBITPORT_GRPC_PORT=50003
      - ORBITPORT_APTOS_PLUGIN=plugin-aptos-orbital:50001
      # Configurable defaults for seed management
      - ORBITPORT_DEFAULT_MASTER_SEEDS=${ORBITPORT_DEFAULT_MASTER_SEEDS}
      - ORBITPORT_MASTERSEED_TRNG_SIZE=32
      - ORBITPORT_MASTERSEED_MAX_SEEDS=100
      - ORBITPORT_MASTERSEED_PERIOD=3600
      - ORBITPORT_MASTER_SEED_MAX_COUNT_PER_REQUEST=1000
    ports:
      - 9003:9000
    depends_on:
      - plugin-aptos-orbital

  plugin-kms:
    <<: *plugin-base
    container_name: plugin-kms
    build:
      context: ./plugins
    image: op-plugin:latest
    environment:
      - GOLOG_LOG_LEVEL=debug
      - ORBITPORT_PLUGIN=kms
      - ORBITPORT_GRPC_PORT=50004
      - ORBITPORT_KMS_OPENBAO_PROXY_URL=http://openbao-proxy:8200
      - ORBITPORT_KMS_TRANSIT_MOUNT=transit
      - ORBITPORT_KMS_KV_MOUNT=orbitport-kv
      - ORBITPORT_KMS_ETHEREUM_MOUNT=ethereum
      - ORBITPORT_KMS_PQC_MOUNT=pqc
    ports:
      - 9004:9000
    depends_on:
      openbao-bootstrap:
        condition: service_completed_successfully
      openbao-proxy:
        condition: service_healthy

  plugin-threshold:
    <<: *plugin-base
    container_name: plugin-threshold
    build:
      context: ./plugins
    image: op-plugin:latest
    environment:
      - GOLOG_LOG_LEVEL=debug
      - ORBITPORT_PLUGIN=threshold
      - ORBITPORT_GRPC_PORT=50005
      - ORBITPORT_THRESHOLD_TIMEOUT_SECS=60
      - ORBITPORT_THRESHOLD_SESSION_SECRET=${ORBITPORT_THRESHOLD_SESSION_SECRET:-dev-threshold-session-secret}
      - ORBITPORT_THRESHOLD_RETRY_ATTEMPTS=${ORBITPORT_THRESHOLD_RETRY_ATTEMPTS:-3}
      - ORBITPORT_THRESHOLD_RETRY_BACKOFF_MILLIS=${ORBITPORT_THRESHOLD_RETRY_BACKOFF_MILLIS:-100}
    ports:
      - 9005:9000
    depends_on:
      openbao-bootstrap:
        condition: service_completed_successfully
      openbao-bootstrap-1:
        condition: service_completed_successfully
      openbao-bootstrap-2:
        condition: service_completed_successfully
      openbao-proxy:
        condition: service_healthy
      openbao-proxy-1:
        condition: service_healthy
      openbao-proxy-2:
        condition: service_healthy

  plugin-auth:
    <<: *plugin-base
    container_name: plugin-auth
    build:
      context: ./plugins
    image: op-plugin:latest
    environment:
      - GOLOG_LOG_LEVEL=debug
      - ORBITPORT_PLUGIN=authnoop
      - ORBITPORT_GRPC_PORT=50000
      # Dev compose intentionally runs the noop auth plugin.

  # Noop account plugin, not the real one: the real plugin needs the dashboard
  # backend and an Auth0 M2M client, neither of which belongs in this stack.
  # This one grants every hold, which is enough to exercise the credit-gating
  # filter and — the reason it is here — to prove KMS tenancy comes from the
  # hold response rather than from the caller's token.
  #
  # For the real thing against a host-run dashboard, stack
  # local-account.compose.yaml on top.
  plugin-account:
    <<: *plugin-base
    container_name: plugin-account
    build:
      context: ./plugins
    image: op-plugin:latest
    environment:
      - GOLOG_LOG_LEVEL=debug
      - ORBITPORT_PLUGIN=accountnoop
      - ORBITPORT_GRPC_PORT=50005
      # Deliberately not an account id or an Auth0 sub, so a KMS namespace
      # built from it is unmistakably the hold's doing.
      - ORBITPORT_ACCOUNTNOOP_KMS_TENANT=${ORBITPORT_ACCOUNTNOOP_KMS_TENANT:-noop-tenant}

  # Mints PATs and serves JWKS. Signs through the dev OpenBao transit mount by
  # default so the signing path this stack exercises is the one production
  # uses; openbao-bootstrap creates the pat-signing key.
  #
  # The gateway's auth plugin here is authnoop, which does not verify PATs, so
  # this stack covers minting, key publication and tenancy. Stack
  # local-pat.compose.yaml for the real auth plugin and full PAT verification.
  plugin-patissuer:
    <<: *plugin-base
    container_name: plugin-patissuer
    build:
      context: ./plugins
    image: op-plugin:latest
    environment:
      - GOLOG_LOG_LEVEL=debug
      - ORBITPORT_PLUGIN=patissuer
      - ORBITPORT_GRPC_PORT=50006
      - ORBITPORT_PATISSUER_ISS=${ORBITPORT_PATISSUER_ISS:-https://auth.orbitport.local}
      - ORBITPORT_PATISSUER_AUD=${ORBITPORT_PATISSUER_AUD:-https://op-dev.spacecomputer.io/api}
      - ORBITPORT_PATISSUER_SIGNER=${ORBITPORT_PATISSUER_SIGNER:-transit}
      - ORBITPORT_PATISSUER_OPENBAO_PROXY_URL=http://openbao-proxy:8200
    depends_on:
      openbao-bootstrap:
        condition: service_completed_successfully
      openbao-proxy:
        condition: service_healthy

  # Publishes the issuer's public keys. The only plugin that answers requests
  # from outside the cluster, which is why it is a separate pod from the patissuer
  # that signs.
  plugin-jwks:
    <<: *plugin-base
    container_name: plugin-jwks
    build:
      context: ./plugins
    image: op-plugin:latest
    environment:
      - GOLOG_LOG_LEVEL=debug
      - ORBITPORT_PLUGIN=jwks
      - ORBITPORT_GRPC_PORT=50008
      - ORBITPORT_JWKS_PATISSUER_PLUGIN=plugin-patissuer:50006
      - ORBITPORT_JWKS_HTTP_PORT=8080
    ports:
      # Host 8091 because 8080 is the gateway and 8081 is ipfs-node.
      - 8091:8080
    depends_on:
      - plugin-patissuer

  ipfs-node:
    image: ipfs/kubo:release
    ports:
      - "4001:4001"  # IPFS Swarm Port
      - "5001:5001"  # IPFS API Port
      - "8081:8080"  # IPFS Gateway Port
    volumes:
      - ./.data/ipfs_dev:/data/ipfs
    command: ["daemon", "--migrate=true"]

  gateway:
    container_name: gateway 
    image: op-gateway:latest
    build:
      context: .
      dockerfile: gateway/Dockerfile
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - dev.threshold-groups.env
    environment:
      - RUST_LOG=warn,gateway=debug
      - ORBITPORT_HTTP_PORT=8080
      - ORBITPORT_AUTH_PLUGIN=http://plugin-auth:50000
      - ORBITPORT_KMS_PLUGIN=http://plugin-kms:50004
      - ORBITPORT_THRESHOLD_ENABLED=${ORBITPORT_THRESHOLD_ENABLED:-true}
      - ORBITPORT_THRESHOLD_PLUGIN=http://plugin-threshold:50005
      - ORBITPORT_TRNG_PLUGIN=http://plugin-aptos-orbital:50001
      - ORBITPORT_MASTERSEED_PLUGIN=http://plugin-masterseed:50003
      - ORBITPORT_ACCOUNT_PLUGIN=http://plugin-account:50005
      - ORBITPORT_PATISSUER_PLUGIN=http://plugin-patissuer:50006
      - ORBITPORT_INTERNAL_PORT=8081
      # Dev-only fixed value so the e2e suite can mint without a shared export.
      - ORBITPORT_PATISSUER_SHARED_SECRET=${ORBITPORT_PATISSUER_SHARED_SECRET:-dev-only-issuer-secret}
    ports:
      - 8080:8080
      # Internal listener. Host 8090 because ipfs-node already takes 8081.
      - 8090:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - plugin-auth
      - plugin-kms
      - plugin-threshold
      - plugin-masterseed
      - plugin-account
      - plugin-patissuer

  plugin-beacon:
    <<: *plugin-base
    container_name: plugin-beacon
    build:
      context: ./plugins
    image: op-plugin:latest
    environment:
      - GOLOG_LOG_LEVEL=debug
      - ORBITPORT_PLUGIN=beacon
      - ORBITPORT_IPFS_PLUGIN=plugin-ipfs:50002
      - ORBITPORT_CTRNG_PLUGIN=plugin-aptos-orbital:50001
      - ORBITPORT_MASTERSEED_PLUGIN=plugin-masterseed:50003
      - ORBITPORT_BEACON_UPDATE_INTERVAL=10
      - ORBITPORT_DEFAULT_BEACON_NAME=randomness-beacon-dev1.0
      - ORBITPORT_BEACON_REGISTRY=orbitport-dev-registry
      - ORBITPORT_REGISTRY_RETRIEVAL_TIMEOUT=90

volumes:
  openbao-plugins:
  openbao-eth-go-pkg:
  openbao-eth-go-build:
  openbao-pqc-cache:
  openbao-pqc-go-pkg:
  openbao-pqc-go-build:
  openbao-threshold-go-pkg:
  openbao-threshold-go-build:
