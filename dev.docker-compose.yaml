x-plugin-base:
  &plugin-base
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:9000/metrics"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 5s

x-mocker-base:
  &mocker-base
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  openbao-eth-plugin-builder:
    container_name: openbao-eth-plugin-builder
    image: golang:1.25-alpine
    working_dir: /src
    volumes:
      - ${ORBITPORT_OPENBAO_ETH_PLUGIN_DIR:-../openbao-eth-plugin-poc}:/src:ro
      - ./docker/openbao:/orbitport/docker/openbao:ro
      - openbao-plugins:/out
      - openbao-eth-go-pkg:/go/pkg/mod
      - openbao-eth-go-build:/root/.cache/go-build
    command:
      - /bin/sh
      - -ec
      - apk add --no-cache build-base linux-headers >/dev/null && /bin/sh /orbitport/docker/openbao/build-eth-plugin.sh /src /out

  openbao:
    container_name: openbao
    image: openbao/openbao:latest
    depends_on:
      openbao-eth-plugin-builder:
        condition: service_completed_successfully
    command:
      - server
      - -dev
      - -dev-root-token-id=root
      - -dev-listen-address=0.0.0.0:8200
      - -dev-plugin-dir=/openbao/plugins
    cap_add:
      - IPC_LOCK
    ports:
      - "18200:8200"
    volumes:
      - openbao-plugins:/openbao/plugins
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 BAO_TOKEN=root bao status >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  openbao-bootstrap:
    container_name: openbao-bootstrap
    image: openbao/openbao:latest
    depends_on:
      openbao:
        condition: service_healthy
      openbao-eth-plugin-builder:
        condition: service_completed_successfully
    restart: "no"
    environment:
      - OPENBAO_ADDR=http://openbao:8200
      - OPENBAO_TOKEN=root
      - OPENBAO_PLUGIN_DIR=/openbao/plugins
      - OPENBAO_ETH_PLUGIN_NAME=ethereum-secrets-plugin
      - OPENBAO_ETH_MOUNT=ethereum
      - OPENBAO_TRANSIT_MOUNT=transit
      - OPENBAO_KV_MOUNT=orbitport-kv
    volumes:
      - openbao-plugins:/openbao/plugins
      - ./docker/openbao:/orbitport/docker/openbao:ro
    command: ["/bin/sh", "/orbitport/docker/openbao/bootstrap.sh"]

  openbao-proxy:
    container_name: openbao-proxy
    image: nginx:1.27-alpine
    depends_on:
      - openbao
    ports:
      - "8200:8200"
    volumes:
      - ./docker/openbao/openbao-proxy.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8200/v1/sys/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 2s

  plugin-ipfs:
    <<: *plugin-base
    container_name: plugin-ipfs
    build:
      context: ./plugins
    image: op-plugin:latest
    environment:
      - GOLOG_LOG_LEVEL=debug
      - ORBITPORT_PLUGIN=ipfs
      - ORBITPORT_GRPC_PORT=50002
      - ORBITPORT_IPFS_ADDRESS=http://ipfs-node:5001
    ports:
      - 50002:50002 # expose the port for integration tests

  crypto2-api:
    <<: *mocker-base
    container_name: crypto2-api
    build:
      context: ./plugins
      args:
        - BUILD_TARGET=mocker
    image: op-mocker:latest
    environment:
      - OPMOCK_SERVICE=crypto2_api
      - OPMOCK_PORT=8001
      - OPMOCK_PROFILE=${OPMOCK_PROFILE}
    depends_on:
      - crypto2-auth

  crypto2-auth:
    <<: *mocker-base
    container_name: crypto2-auth
    build:
      context: ./plugins
      args:
        - BUILD_TARGET=mocker
    image: op-mocker:latest
    environment:
      - OPMOCK_SERVICE=crypto2_auth
      - OPMOCK_PORT=8002
    ports:
      - "8002:8002"

  plugin-crypto2:
    <<: *plugin-base
    container_name: plugin-crypto2
    build:
      context: ./plugins
    image: op-plugin:latest
    environment:
      - GOLOG_LOG_LEVEL=debug
      - ORBITPORT_PLUGIN=crypto2
      - ORBITPORT_GRPC_PORT=50001
      # Mock credentials for the local dev mocker only. These are not real secrets.
      - ORBITPORT_CRYPTO2_CLIENT_ID=dev-client-id
      - ORBITPORT_CRYPTO2_CLIENT_SECRET=dev-client-secret
      - ORBITPORT_CRYPTO2_API_URL=http://crypto2-api:8001
      - ORBITPORT_CRYPTO2_AUTH_URL=http://crypto2-auth:8002
    depends_on:
      - plugin-auth
      - crypto2-api
      - crypto2-auth

  plugin-masterseed:
    <<: *plugin-base
    container_name: plugin-masterseed
    build:
      context: ./plugins
    image: op-plugin:latest
    environment:
      - GOLOG_LOG_LEVEL=debug
      - ORBITPORT_PLUGIN=masterseed
      - ORBITPORT_GRPC_PORT=50003
      - ORBITPORT_CRYPTO2_PLUGIN=plugin-crypto2:50001
      # Configurable defaults for seed management
      - ORBITPORT_DEFAULT_MASTER_SEEDS=${ORBITPORT_DEFAULT_MASTER_SEEDS}
      - ORBITPORT_MASTERSEED_TRNG_SIZE=32
      - ORBITPORT_MASTERSEED_MAX_SEEDS=100
      - ORBITPORT_MASTERSEED_PERIOD=3600
      - ORBITPORT_MASTER_SEED_MAX_COUNT_PER_REQUEST=1000
    ports:
      - 9003:9000
    depends_on:
      - plugin-crypto2

  plugin-kms:
    <<: *plugin-base
    container_name: plugin-kms
    build:
      context: ./plugins
    image: op-plugin:latest
    environment:
      - GOLOG_LOG_LEVEL=debug
      - ORBITPORT_PLUGIN=kms
      - ORBITPORT_GRPC_PORT=50004
      - ORBITPORT_KMS_OPENBAO_PROXY_URL=http://openbao-proxy:8200
      - ORBITPORT_KMS_TRANSIT_MOUNT=transit
      - ORBITPORT_KMS_KV_MOUNT=orbitport-kv
      - ORBITPORT_KMS_ETHEREUM_MOUNT=ethereum
    ports:
      - 9004:9000
    depends_on:
      openbao-bootstrap:
        condition: service_completed_successfully
      openbao-proxy:
        condition: service_healthy

  plugin-auth:
    <<: *plugin-base
    container_name: plugin-auth
    build:
      context: ./plugins
    image: op-plugin:latest
    environment:
      - GOLOG_LOG_LEVEL=debug
      - ORBITPORT_PLUGIN=authnoop
      - ORBITPORT_GRPC_PORT=50000
      # Dev compose intentionally runs the noop auth plugin.

  # The account plugin is intentionally NOT enabled in dev compose because the
  # dashboard backend isn't part of this stack. To enable locally, run the
  # dashboard separately (e.g. on the host), uncomment the block below, and
  # set ORBITPORT_ACCOUNT_PLUGIN on the gateway service.
  #
  # plugin-account:
  #   <<: *plugin-base
  #   container_name: plugin-account
  #   build:
  #     context: ./plugins
  #   image: op-plugin:latest
  #   environment:
  #     - GOLOG_LOG_LEVEL=debug
  #     - ORBITPORT_PLUGIN=account
  #     - ORBITPORT_GRPC_PORT=50005
  #     - ORBITPORT_ACCOUNT_DASHBOARD_URL=http://host.docker.internal:3000
  #     - ORBITPORT_ACCOUNT_AUTH0_DOMAIN=${ORBITPORT_ACCOUNT_AUTH0_DOMAIN}
  #     - ORBITPORT_ACCOUNT_AUTH0_AUDIENCE=${ORBITPORT_ACCOUNT_AUTH0_AUDIENCE}
  #     - ORBITPORT_ACCOUNT_AUTH0_CLIENT_ID=${ORBITPORT_ACCOUNT_AUTH0_CLIENT_ID}
  #     - ORBITPORT_ACCOUNT_AUTH0_CLIENT_SECRET=${ORBITPORT_ACCOUNT_AUTH0_CLIENT_SECRET}

  ipfs-node:
    image: ipfs/kubo:release
    ports:
      - "4001:4001"  # IPFS Swarm Port
      - "5001:5001"  # IPFS API Port
      - "8081:8080"  # IPFS Gateway Port
    volumes:
      - ./.data/ipfs_dev:/data/ipfs
    command: ["daemon", "--migrate=true"]

  gateway:
    container_name: gateway 
    image: op-gateway:latest
    build:
      context: .
      dockerfile: gateway/Dockerfile
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - RUST_LOG=warn,gateway=debug
      - ORBITPORT_HTTP_PORT=8080
      - ORBITPORT_AUTH_PLUGIN=http://plugin-auth:50000
      - ORBITPORT_KMS_PLUGIN=http://plugin-kms:50004
      - ORBITPORT_TRNG_PLUGIN=http://plugin-crypto2:50001
      - ORBITPORT_MASTERSEED_PLUGIN=http://plugin-masterseed:50003
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - plugin-auth
      - plugin-kms
      - plugin-masterseed

  plugin-beacon:
    <<: *plugin-base
    container_name: plugin-beacon
    build:
      context: ./plugins
    image: op-plugin:latest
    environment:
      - GOLOG_LOG_LEVEL=debug
      - ORBITPORT_PLUGIN=beacon
      - ORBITPORT_IPFS_PLUGIN=plugin-ipfs:50002
      - ORBITPORT_CTRNG_PLUGIN=plugin-crypto2:50001
      - ORBITPORT_MASTERSEED_PLUGIN=plugin-masterseed:50003
      - ORBITPORT_BEACON_UPDATE_INTERVAL=10
      - ORBITPORT_DEFAULT_BEACON_NAME=randomness-beacon-dev1.0
      - ORBITPORT_BEACON_REGISTRY=orbitport-dev-registry
      - ORBITPORT_REGISTRY_RETRIEVAL_TIMEOUT=90

volumes:
  openbao-plugins:
  openbao-eth-go-pkg:
  openbao-eth-go-build:
