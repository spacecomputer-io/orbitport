openapi: 3.0.0
info:
  title: OrbitPort API
  version: 0.1.0
paths:
  /v1/rand_seed:
    get:
      summary: Get Random Seed
      description: Delegates the request to the underlying provider to get a random seed.
      parameters:
        - in: query
          name: src
          schema:
            type: array
            items:
              type: string
          description: The provider to use. At the moment only `space/aptos_orbital` (default) is supported and we fallback to `local/space_seed`.
      responses:
        '200':
          description: A 32 byte chunk of random data as a hexadecimal string.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: string
                    description: A 32 byte chunk of random data as a hexadecimal string.
                  sig:
                    type: string
                    description: The signature provided by the satellite.
                  src:
                    type: string
                    description: The source of the random data.
              example:
                value: "a1b2c3d4e5f67890abcdef1234567890a1b2c3d4e5f67890abcdef1234567890"
                sig: "3046022100a1b2c3d4e5f67890abcdef1234567890a1b2c3d4e5f67890abcdef1234567890022100a1b2c3d4e5f67890abcdef1234567890"
                src: "space/aptos_orbital"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
              example:
                message: "Internal Server Error"