openapi: 3.0.0
info:
  title: OrbitPort API
  version: 0.2.0
  description: |
    Orbitport is a gateway to orbital services such as `cTRNG` (cosmic True Random Number Generator) or `spaceTEE`.
paths:
  /api/v1/services/trng:
    get:
      summary: Cosmic True Random Number Generator
      description: The cosmic True Random Number Generation (cTRNG) provides true random numbers harvested from hardware on satellites, or uses a cTRNG seed to derive random numbers.
      parameters:
        - in: query
          name: src
          schema:
            type: string
            enum: [aptosorbital, derived]
            default: aptosorbital
          description: |
            The gateway supports multiple sources of randomness:
            1. **aptosorbital**: Space-based randomness provided by `cEDGE` or `Crypto2` satellites.
            2. **derived**: Randomness derived from a cosmic TRNG (master seed) that is fetched continuously. The seed is used to generate more random numbers when satellites are not responsive, by using it as a seed for a BIP32 master key and deriving keys from it.
        - in: query
          name: bulk
          schema:
            type: integer
            minimum: 0
            maximum: 10
            default: 0
          description: |
            The number of derived random numbers to be generated. The maximum is 10. The default is 0.
      responses:
        '200':
          description: A cTRNG response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  src:
                    type: string
                    description: The source of the random data, either `aptosorbital` or `derived`.
                    enum:
                      - aptosorbital
                      - derived
                  service:
                    type: string
                    description: The service providing the random data, in this case, `trng`.
                    enum:
                      - trng
                  data:
                    type: string
                    description: A 32 byte chunk of random data as a hexadecimal string.
                  signature:
                    type: object
                    description: The signature provided by the satellite.
                    properties:
                      value:
                        type: string
                        description: The signature value.
                      pk:
                        type: string
                        description: The public key used for the signature.
              example:
                service: "trng"
                src: "aptosorbital"
                data: "a1b2c3d4e5f67890abcdef1234567890a1b2c3d4e5f67890abcdef1234567890"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
              example:
                message: "Internal Server Error"
  /api/v1/rpc:
    post:
      summary: JSON-RPC endpoint
      description: |
        Authenticated JSON-RPC endpoint for Orbitport services. KMS key-store
        methods use the existing `/api/v1/rpc` path with methods
        `kms_keystore.Put`, `kms_keystore.Get`, `kms_keystore.List`, and
        `kms_keystore.Delete`. Key-store tenant isolation is enforced by the
        authenticated `client_id`, validated names, and OpenBao path
        construction under the caller's tenant namespace; Cedar adds policy
        control on top of that isolation boundary.
        The local stdio MCP executable calls this same endpoint using a PAT.
        no hosted MCP route is added. Manual calls remain available with PATs.
        Customer authentication accepts PATs only. Auth0 service tokens cannot
        authenticate on this endpoint.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            examples:
              kmsKeyStorePut:
                summary: Store a key-store secret
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: kms_keystore.Put
                  params:
                    Name: github/prod
                    Secret:
                      api_key: replace-me
              kmsKeyStoreGet:
                summary: Retrieve a key-store secret
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: kms_keystore.Get
                  params:
                    Name: github/prod
      responses:
        '200':
          description: JSON-RPC response. Application errors are returned in the JSON-RPC `error` object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
              examples:
                kmsKeyStorePut:
                  summary: Put response
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result:
                      Name: github/prod
                      Version: 1
                kmsKeyStoreGet:
                  summary: Get response
                  value:
                    jsonrpc: "2.0"
                    id: 2
                    result:
                      Name: github/prod
                      Secret:
                        api_key: replace-me
        '403':
          description: The account is inactive and cannot place a credit hold.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [account_inactive]
              example:
                error: account_inactive
        '413':
          description: The HTTP request body exceeds ORBITPORT_RPC_BODY_MAX_BYTES (64 KiB by default).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    enum: [payload_too_large]
              example:
                error: payload_too_large
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    JsonRpcRequest:
      type: object
      required:
        - jsonrpc
        - id
        - method
        - params
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          type: integer
          format: int64
        method:
          type: string
          enum:
            - ctrng.Get
            - kms.GetCapabilities
            - kms.CreateKey
            - kms.Encrypt
            - kms.Decrypt
            - kms.Sign
            - kms.Encapsulate
            - kms.Decapsulate
            - kms.GenerateDataKey
            - kms.RotateKey
            - kms.GetKeyMetadata
            - kms.GetPublicKey
            - kms.ListKeys
            - kms.DisableKey
            - kms.EnableKey
            - kms.ScheduleKeyDeletion
            - kms.CancelKeyDeletion
            - kms_keystore.Put
            - kms_keystore.Get
            - kms_keystore.List
            - kms_keystore.Delete
            - kms_threshold.CoordinateDKG
        params:
          type: object
          additionalProperties: true
          description: Method-specific params. See examples and key-store param schemas below.
          nullable: true
    JsonRpcResponse:
      type: object
      required:
        - jsonrpc
        - id
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          type: integer
          format: int64
        result:
          type: object
          additionalProperties: true
        error:
          $ref: '#/components/schemas/JsonRpcError'
    JsonRpcError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          nullable: true
          description: >-
            Optional error details. For execution errors (-32001), reason may
            be not_found, permission_denied, failed_precondition, invalid_argument, or aborted.
          example:
            reason: not_found
    KmsListKeysParams:
      type: object
      description: Lists IDs across all engines in the authenticated tenant, with one OpenBao LIST per page and local sorting/pagination.
      properties:
        Limit:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1000
          default: 100
        NextToken:
          type: string
          nullable: true
          minLength: 1
          maxLength: 512
          description: Opaque continuation cursor; does not select or change the tenant.
    KmsListKeysResult:
      type: object
      required: [KeyIds, NextToken]
      properties:
        KeyIds:
          type: array
          items:
            type: string
          description: Sorted canonical key IDs, including disabled and pending-deletion keys.
        NextToken:
          type: string
          nullable: true
          description: Null at the end of the list; listing is not a snapshot across pages.
    KmsLifecycleParams:
      type: object
      required: [KeyId]
      description: Params for kms.DisableKey, kms.EnableKey and kms.CancelKeyDeletion. These lifecycle mutations support TRANSIT only.
      properties:
        KeyId:
          type: string
          description: Canonical kms:alias key ID or raw alias, scoped by authentication.
    KmsScheduleKeyDeletionParams:
      allOf:
        - $ref: '#/components/schemas/KmsLifecycleParams'
        - type: object
          properties:
            PendingWindowInDays:
              type: integer
              nullable: true
              minimum: 7
              maximum: 30
              default: 30
              description: Disables the key immediately. Permanent deletion becomes eligible after this window; it is processed by the background worker, not an OpenBao TTL.
    KmsLifecycleResult:
      type: object
      properties:
        KeyMetadata:
          type: object
          additionalProperties: true
          properties:
            Enabled:
              type: boolean
            KeyState:
              type: string
              nullable: true
              enum: [ENABLED, DISABLED, PENDING_DELETION, null]
            DeletionDate:
              type: string
              format: date-time
              nullable: true
          description: Existing metadata plus lifecycle fields. Cancellation returns DISABLED; enabled and pending metadata/public keys remain readable while material exists.
    KmsScheduleKeyDeletionResult:
      allOf:
        - $ref: '#/components/schemas/KmsLifecycleResult'
        - type: object
          properties:
            PendingWindowInDays:
              type: integer
              minimum: 7
              maximum: 30
    KmsKeyStorePutParams:
      type: object
      required:
        - Name
        - Secret
      properties:
        Name:
          $ref: '#/components/schemas/KmsKeyStoreName'
        Secret:
          type: object
          additionalProperties: true
          description: Arbitrary JSON object stored durably in the KMS key-store. Secrets are treated as opaque JSON and returned without numeric precision loss.
    KmsKeyStoreGetParams:
      type: object
      required:
        - Name
      properties:
        Name:
          $ref: '#/components/schemas/KmsKeyStoreName'
    KmsKeyStoreListParams:
      type: object
      properties:
        Prefix:
          type: string
          maxLength: 256
          description: Optional key-store prefix to list. The response includes only immediate children for this prefix.
    KmsKeyStoreDeleteParams:
      type: object
      required:
        - Name
      properties:
        Name:
          $ref: '#/components/schemas/KmsKeyStoreName'
    KmsKeyStorePutResult:
      type: object
      properties:
        Name:
          type: string
        Version:
          type: integer
    KmsKeyStoreGetResult:
      type: object
      properties:
        Name:
          type: string
        Secret:
          type: object
          additionalProperties: true
    KmsKeyStoreListResult:
      type: object
      properties:
        Names:
          type: array
          items:
            type: string
          description: Immediate key-store entries and folders under the requested prefix. Folder prefixes end with `/`.
    KmsKeyStoreDeleteResult:
      type: object
      properties:
        Name:
          type: string
    KmsKeyStoreName:
      type: string
      maxLength: 256
      pattern: '^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'
      description: Slash-separated key-store name. `.` and `..` path segments are rejected.
