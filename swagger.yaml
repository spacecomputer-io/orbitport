openapi: 3.0.0
info:
  title: OrbitPort API
  version: 0.2.0
  description: |
    Orbitport is a gateway to orbital services such as `cTRNG` (cosmic True Random Number Generator) or `spaceTEE`.
paths:
  /api/v1/services/trng:
    get:
      summary: Cosmic True Random Number Generator
      description: The cosmic True Random Number Generation (cTRNG) provides true random numbers harvested from hardware on satellites, or uses a cTRNG seed to derive random numbers.
      parameters:
        - in: query
          name: src
          schema:
            type: string
            enum: [aptosorbital, derived]
            default: aptosorbital
          description: |
            The gateway supports multiple sources of randomness:
            1. **aptosorbital**: Space-based randomness provided by `cEDGE` or `Crypto2` satellites.
            2. **derived**: Randomness derived from a cosmic TRNG (master seed) that is fetched continuously. The seed is used to generate more random numbers when satellites are not responsive, by using it as a seed for a BIP32 master key and deriving keys from it.
        - in: query
          name: bulk
          schema:
            type: integer
            minimum: 0
            maximum: 10
            default: 0
          description: |
            The number of derived random numbers to be generated. The maximum is 10. The default is 0.
      responses:
        '200':
          description: A cTRNG response
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  src:
                    type: string
                    description: The source of the random data, either `aptosorbital` or `derived`.
                    enum:
                      - aptosorbital
                      - derived
                  service:
                    type: string
                    description: The service providing the random data, in this case, `trng`.
                    enum:
                      - trng
                  data:
                    type: string
                    description: A 32 byte chunk of random data as a hexadecimal string.
                  signature:
                    type: object
                    description: The signature provided by the satellite.
                    properties:
                      value:
                        type: string
                        description: The signature value.
                      pk:
                        type: string
                        description: The public key used for the signature.
              example:
                service: "trng"
                src: "aptosorbital"
                data: "a1b2c3d4e5f67890abcdef1234567890a1b2c3d4e5f67890abcdef1234567890"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
              example:
                message: "Internal Server Error"
  /api/v1/rpc:
    post:
      summary: JSON-RPC gateway
      description: |
        Executes Orbitport JSON-RPC methods over the existing `/api/v1/rpc`
        endpoint. KMS BYOK support uses true cryptographic key import/export:
        clients wrap key material locally with the Transit wrapping key, then
        Orbitport imports only wrapped ciphertext. Secure export returns only
        Transit `byok-export` wrapped ciphertext by version, never plaintext
        key material. `kms.ImportKeyMaterial` defaults `Exportable` to `true`
        when omitted; callers can explicitly send `Exportable: false` to lock
        the key inside KMS permanently. `kms.DeleteKey` permanently deletes
        Transit key material through OpenBao after enabling OpenBao's
        `deletion_allowed` guard for that key.

        BYOK v1 is Transit-only. Ethereum and PQC BYOK requests return
        `Unimplemented` until those OpenBao plugins support compatible
        wrapped import/export.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, id, method, params]
              properties:
                jsonrpc:
                  type: string
                  enum: ["2.0"]
                id:
                  type: integer
                method:
                  type: string
                  enum:
                    - kms.GetCapabilities
                    - kms.GetImportParameters
                    - kms.ImportKeyMaterial
                    - kms.ImportKeyMaterialVersion
                    - kms.RegisterExportWrappingKey
                    - kms.ExportKeyMaterial
                    - kms.DeleteKey
                params:
                  type: object
                  additionalProperties: true
            examples:
              getImportParameters:
                summary: Get Transit import wrapping parameters
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: kms.GetImportParameters
                  params:
                    Scheme: TRANSIT
                    KeySpec: AES_256_GCM96
                    KeyUsage: ENCRYPT_DECRYPT
                    HashFunction: SHA256
              importKeyMaterial:
                summary: Import locally wrapped BYOK material
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: kms.ImportKeyMaterial
                  params:
                    Alias: imported-aes
                    Scheme: TRANSIT
                    KeySpec: AES_256_GCM96
                    KeyUsage: ENCRYPT_DECRYPT
                    HashFunction: SHA256
                    Ciphertext: REPLACE_WITH_TRANSIT_WRAPPED_KEY_MATERIAL
                    Exportable: true
              exportKeyMaterial:
                summary: Export as ciphertext wrapped to a registered destination
                value:
                  jsonrpc: "2.0"
                  id: 3
                  method: kms.ExportKeyMaterial
                  params:
                    KeyId: kms:imported-aes
                    DestinationKeyId: kms:target-wrap
                    Version: 1
                    HashFunction: SHA256
      responses:
        '200':
          description: JSON-RPC success or JSON-RPC error envelope
          content:
            application/json:
              schema:
                type: object
                required: [jsonrpc, id]
                properties:
                  jsonrpc:
                    type: string
                    enum: ["2.0"]
                  id:
                    type: integer
                  result:
                    type: object
                    additionalProperties: true
                  error:
                    type: object
                    properties:
                      code:
                        type: integer
                      message:
                        type: string
              examples:
                importParametersResponse:
                  summary: GetImportParameters response
                  value:
                    jsonrpc: "2.0"
                    id: 1
                    result:
                      WrappingKey: "-----BEGIN PUBLIC KEY-----..."
                      WrappingAlgorithm: RSA-OAEP-4096
                      HashFunction: SHA256
                      KeyMaterialFormat: RAW
                exportResponse:
                  summary: ExportKeyMaterial response
                  value:
                    jsonrpc: "2.0"
                    id: 3
                    result:
                      KeyId: kms:imported-aes
                      DestinationKeyId: kms:target-wrap
                      HashFunction: SHA256
                      WrappedKeyMaterialByVersion:
                        "1": wrapped-ciphertext
