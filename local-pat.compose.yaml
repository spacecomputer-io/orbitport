# Full PAT verification overlay.
#
# The dev stack already runs plugin-issuer and mints real PATs, but its auth
# plugin is authnoop, which accepts any string and never verifies a signature.
# This swaps in the real auth plugin with the PAT path enabled, so presenting a
# PAT actually checks its signature, issuer, audience and expiry against the
# published JWKS.
#
# Stack it when you are changing PAT verification. The dev stack alone is
# enough for minting, JWKS and tenancy.
#
#   docker compose --env-file=.dev.env -f dev.docker-compose.yaml \
#     -f local-pat.compose.yaml up -d --build
#
# Trade-off: with the real auth plugin the legacy e2e suites fail, since they
# authenticate with the literal "test_access_token" that only authnoop accepts.
#
# Ports (unchanged by this overlay):
#   8080  public API + GET /.well-known/jwks.json
#   8090  internal listener -> container 8081, POST /internal/pat/issue
#
# The dashboard backend pairs with this via:
#   ORBITPORT_ISSUER_URL=http://host.docker.internal:8090
#   ORBITPORT_ISSUER_SHARED_SECRET=<must match the gateway's>

services:
  # Auth0 vars serve the legacy-token path only.
  plugin-auth:
    environment:
      - ORBITPORT_PLUGIN=auth
      - ORBITPORT_AUTH0_DOMAIN=${ORBITPORT_AUTH0_DOMAIN:-auth.spacecomputer.io}
      - ORBITPORT_AUTH0_AUDIENCE=${ORBITPORT_AUTH0_AUDIENCE:-https://op-dev.spacecomputer.io/api}
      - ORBITPORT_AUTH_PAT_ISS=${ORBITPORT_ISSUER_ISS:-https://auth.orbitport.local}
      - ORBITPORT_AUTH_PAT_AUDIENCE=${ORBITPORT_ISSUER_AUD:-https://op-dev.spacecomputer.io/api}
      - ORBITPORT_AUTH_ISSUER_PLUGIN=plugin-issuer:50006
    depends_on:
      - plugin-issuer
